let _reqPoller=null;
function startReqPoller(orderId){
  if(_reqPoller&&_reqPoller.id===String(orderId))return; // уже запущен для этого заказа
  stopReqPoller();
  const oid=String(orderId);
  const timer=setInterval(async()=>{
    // Проверяем что пользователь ещё на шаге 4
    if(!S.checkout||S.checkout.orderId!=oid||S.checkout.step!==4){
      stopReqPoller();return;
    }
    try{
      const r=await fetch('/api/order-state',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'get_order',orderId:oid})});
      const d=await r.json();
      if(!d.ok||!d.state)return;
      const st=d.state;
      if(st.payState==='cancelled'){
        stopReqPoller();
        S.checkout.payStatus='fail';S.checkout.step=7;
        saveCheckout(S.checkout);render();return;
      }
      if(st.payState==='requisites_sent'){
        stopReqPoller();
        const co=S.checkout;
        co.payBank=BANKS.find(b=>b.id===st.payBankId)
                 ||BANKS.find(b=>b.name===st.payBank)
                 ||BANKS[0];
        co.payPhone=st.payPhone||'—';
        co.payName=st.payName||'—';
        // Сохраняем в localStorage тоже
        setLocalOrderState(oid,st);
        co.step=4;saveCheckout(co);render();return;
      }
    }catch(e){}
  },2500);
  _reqPoller={id:oid,timer};
}
function stopReqPoller(){
  if(_reqPoller){clearInterval(_reqPoller.timer);_reqPoller=null;}
}

function buildCO5(page){
  const co=S.checkout;

  scr.appendChild(el('div',{css:'font-size:22px;font-weight:800;margin-bottom:30px;'},['Проверяем платёж...']));
  scr.appendChild(el('div',{cls:'spinner',css:'margin:0 auto 30px;border-top-color:var(--green);'}));
  const msgDiv=el('div',{id:'co6msg',css:'font-size:13px;color:var(--txt3);min-height:20px;transition:opacity .5s;'});
  msgDiv.textContent=PAY_MSGS[0];scr.appendChild(msgDiv);page.appendChild(scr);
  if(!co._payMsgTimer){
    let pi=0;
    co._payMsgTimer=setInterval(()=>{
      pi++;const last=pi>=PAY_MSGS.length-1;
      const idx=last?PAY_MSGS.length-2+(pi%2):pi;
      const md=document.getElementById('co6msg');
      if(md){md.style.opacity='0';setTimeout(()=>{if(md){md.textContent=PAY_MSGS[Math.min(idx,PAY_MSGS.length-1)];md.style.opacity='1';}},500);}
    },3000);
    // localStorage polling — синхронный
    co._confirmPoll=setInterval(()=>{
      if(!S.checkout||S.checkout.orderId!==co.orderId){
        clearInterval(co._confirmPoll);co._confirmPoll=null;return;
      }
      const ord=getLocalOrderState(co.orderId);
      if(!ord)return;
      if(ord.payState==='confirmed'){
        clearInterval(co._confirmPoll);clearInterval(co._payMsgTimer);
        co._confirmPoll=null;co._payMsgTimer=null;
        co.payStatus='ok';co.step=6;render();
      }else if(ord.payState==='cancelled'){
        clearInterval(co._confirmPoll);clearInterval(co._payMsgTimer);
        co._confirmPoll=null;co._payMsgTimer=null;
        co.payStatus='fail';co.step=6;render();
      }
    },1000);
  }
}

function buildChatDialog(page){
  const chat=S.activeChat;
  // Правка 12: обнуляем непрочитанные при открытии чата
  const unreadInThisChat=chat.msgs.filter(m=>m.from==='admin'&&m.unread).length;
  if(unreadInThisChat>0){
    chat.msgs.forEach(m=>{if(m.from==='admin')m.unread=false;});
    S.unreadChats=Math.max(0,(S.unreadChats||0)-unreadInThisChat);
    save();
  }
  const hdr=el('div',{cls:'hdr'});
  // Правка 4: большая кнопка назад в чате
  const chatBackBtn=el('button',{
    css:'display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--accent);font-size:17px;font-weight:700;cursor:pointer;padding:4px 8px;min-width:60px;',
    onClick:()=>{S.activeChat=null;render();}});
  chatBackBtn.textContent='‹ Назад';
  hdr.appendChild(chatBackBtn);
  // Правка 5: тема по центру — используем position:absolute для истинного центра
  const info=el('div',{css:'position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;'});
  info.appendChild(el('div',{css:'font-size:15px;font-weight:700;white-space:nowrap;'},[chat.topic]));
  info.appendChild(el('div',{css:'font-size:11px;font-weight:700;color:'+(chat.status==='Активный'?'var(--green)':'var(--txt3)')+';'},[chat.status+(chat.orderId?' · Заказ №'+chat.orderId:'')]));
  hdr.appendChild(info);
  hdr.appendChild(el('div',{css:'min-width:60px;'})); // балансирующий элемент
  hdr.style.position='relative';
  page.appendChild(hdr);
  const msgArea=el('div',{id:'msgArea',css:'flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;'});
  if(!chat.msgs.length){msgArea.appendChild(el('div',{css:'text-align:center;padding:40px;color:var(--txt3);font-size:14px;'},['Напишите первое сообщение']));}
  chat.msgs.forEach(m=>{
    const bub=el('div',{cls:'msg-bubble '+(m.from==='user'?'msg-out':'msg-in')});
    if(m.type==='img'){const img=el('img',{src:m.url,css:'max-width:200px;border-radius:12px;display:block;'});bub.appendChild(img);}
    else bub.appendChild(txt(m.text||''));
    const tm=el('div',{css:'font-size:10px;opacity:.5;margin-top:4px;text-align:'+(m.from==='user'?'right':'left')+';'},[m.time||'']);
    bub.appendChild(tm);msgArea.appendChild(bub);
  });
  page.appendChild(msgArea);
  if(chat.status==='Активный'){
    const bar=el('div',{css:'padding:10px 14px calc(10px + var(--safe-b));background:var(--nav-bg);backdrop-filter:blur(40px);border-top:0.5px solid var(--border);display:flex;gap:8px;align-items:center;'});
    const inp=el('input',{cls:'inp',css:'flex:1;padding:12px 16px;',placeholder:'Сообщение...'});
    const sendB=el('button',{css:'width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff375f);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(238,158,35,.4);',
      onClick:()=>{
        if(!inp.value.trim())return;
        const msgText=inp.value;
        const isFirstMsg=chat.msgs.length===0;
        const newMsg={from:'user',text:msgText,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),adminUnread:true};
        chat.msgs.push(newMsg);
        inp.value='';save();
        // Синхронизируем сообщение в KV и уведомляем админа
        apiCall({action:'chat_msg',chatId:chat.id,msgData:newMsg});
        // Правка 2: авто-ответ ТОЛЬКО на первое сообщение
        if(isFirstMsg){
          setTimeout(()=>{
            const userName=S.user?S.user.name:'Пользователь';
            const autoText='Здравствуйте, '+userName+'!\n\nНаши операторы уже работают по вашему обращению.\n\nОтветим в течении нескольких минут!';
            chat.msgs.push({from:'admin',text:autoText,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});
            save();
            const ma=document.getElementById('msgArea');if(ma){
              const bub=el('div',{cls:'msg-bubble msg-in'});
              bub.style.whiteSpace='pre-line';
              bub.appendChild(txt(autoText));
              ma.appendChild(bub);ma.scrollTop=ma.scrollHeight;
            }
          },1500);
        }
        const ma=document.getElementById('msgArea');if(ma){
          const bub=el('div',{cls:'msg-bubble msg-out'});bub.appendChild(txt(msgText));ma.appendChild(bub);ma.scrollTop=ma.scrollHeight;
        }
      }},['↑']);
    bar.appendChild(inp);bar.appendChild(sendB);page.appendChild(bar);
  }else{
    page.appendChild(el('div',{css:'padding:14px;text-align:center;font-size:13px;color:var(--txt3);background:var(--nav-bg);'},['Чат закрыт']));
  }
  setTimeout(()=>{const ma=document.getElementById('msgArea');if(ma)ma.scrollTop=ma.scrollHeight;},50);
  // Polling новых сообщений от админа (бесшовно — только добавляем пузыри)
  if(chat.status==='Активный'&&!chat._pollTimer){
    chat._pollTimer=setInterval(async()=>{
      if(!S.activeChat||!S.chatOpen){clearInterval(chat._pollTimer);chat._pollTimer=null;return;}
      try{
        const r=await fetch('/api/poll',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'get_chat',chatId:chat.id})});
        const d=await r.json();
        if(!d.ok||!d.chat)return;
        const newMsgs=d.chat.msgs||[];
        const curLen=chat.msgs.length;
        if(newMsgs.length>curLen){
          const added=newMsgs.slice(curLen);
          added.forEach(m=>{
            chat.msgs.push(m);
            const ma=document.getElementById('msgArea');
            if(ma){
              const bub=el('div',{cls:'msg-bubble '+(m.from==='user'?'msg-out':'msg-in')});
              bub.style.whiteSpace='pre-line';
              bub.appendChild(txt(m.text||''));
              const tm=el('div',{css:'font-size:10px;opacity:.5;margin-top:4px;text-align:'+(m.from==='user'?'right':'left')+';'},[m.time||'']);
              bub.appendChild(tm);ma.appendChild(bub);ma.scrollTop=ma.scrollHeight;
            }
          });
          save();
        }
      }catch(e){}
    },3000);
  }
}

function buildFAQ(question, answer){
  let open=false;
  const item=document.createElement('div');item.className='faq-item';
  const btn=document.createElement('button');btn.className='faq-q';
  btn.appendChild(Object.assign(document.createElement('span'),{textContent:question}));
  const arr=document.createElement('span');arr.className='faq-arr';arr.textContent='›';
  btn.appendChild(arr);
  const body=document.createElement('div');body.className='faq-body';
  const txt=document.createElement('div');txt.className='faq-txt';
  txt.textContent=answer;
  body.appendChild(txt);
  btn.addEventListener('click',()=>{
    open=!open;
    body.classList.toggle('open',open);
    arr.classList.toggle('open',open);
  });
  item.appendChild(btn);item.appendChild(body);
  return item;
}

    // Отправляем код подтверждения
    cont.disabled=true;cont.textContent='Отправляем...';
    try{
      S.obPhone='+7'+boxes.map(b=>b.value).join('');S.obStep=3;render();
    }catch(e){
      // Fallback: без верификации если API недоступен
      S.obStep=3;render();
    }
  });

  const phoneRow=document.createElement('div');
  phoneRow.className='phone-row';
  const prefix=document.createElement('span');prefix.className='phone-prefix';prefix.textContent='+7';
  const openParen=document.createElement('span');openParen.className='phone-sep';openParen.textContent='(';
  phoneRow.appendChild(prefix);phoneRow.appendChild(openParen);

  GROUPS.forEach((len,gi)=>{
    for(let j=0;j<len;j++){
      const idx=boxes.length;
      const box=document.createElement('input');
      box.className='otp-box';box.type='tel';box.maxLength=1;box.inputMode='numeric';box.placeholder='•';
      boxes.push(box);phoneRow.appendChild(box);
      box.addEventListener('input',()=>{
        if(box.value&&!/\d/.test(box.value)){box.value='';return;}
        if(box.value)box.classList.add('ok');else box.classList.remove('ok');
        if(box.value&&idx<9)boxes[idx+1].focus();
        cont.style.display=boxes.filter(b=>b.value).length===10?'block':'none';
      });
      box.addEventListener('keydown',(e)=>{if(e.key==='Backspace'&&!box.value&&idx>0)boxes[idx-1].focus();});
    }
    if(gi===0){const s=document.createElement('span');s.className='phone-sep';s.textContent=')';phoneRow.appendChild(s);}
    else if(gi<3){const s=document.createElement('span');s.className='phone-sep';s.textContent='-';phoneRow.appendChild(s);}
  });

  d.appendChild(phoneRow);d.appendChild(cont);
  return d;
}

        addLog('Оплата подтверждена по заказу №'+ordId,'');
        notifyAdmin({action:'order_confirmed',orderId:String(ordId)});
        // Начисляем баллы когда закрываем через ЗАКРЫТ, не здесь
        save();showNotif('Оплата подтверждена!','');S.adminDetail=null;render();
      }});
      confB.textContent='Деньги получены';

      const cancelB=el('button',{
        css:'flex:1;padding:17px;border-radius:20px;border:1px solid rgba(255,55,95,.4);background:rgba(255,55,95,.1);color:var(--pink);font-size:16px;font-weight:700;cursor:pointer;',
        onClick:async()=>{
          setLocalOrderState(ordId,{payState:'cancelled'});
          o.status='Отменён';o.payState='cancelled';
          addLog('Оплата отклонена по заказу №'+ordId,'');
          save();showNotif('Заказ отменён','❌');S.adminDetail=null;render();
        }});
      cancelB.textContent='❌ Отменить';
      btnRow.appendChild(confB);btnRow.appendChild(cancelB);scr.appendChild(btnRow);
    }

    // ── РЕКВИЗИТЫ ОТПРАВЛЕНЫ, ЖДЁМ ОПЛАТЫ ──
    else if(payState==='requisites_sent'){
      const hd=el('div',{css:'background:rgba(74,181,255,.1);border:1px solid rgba(74,181,255,.3);border-radius:14px;padding:14px;text-align:center;margin-bottom:14px;'});
      hd.appendChild(el('div',{css:'font-size:15px;font-weight:700;color:var(--blue);'},['⏳ Ожидаем оплату от клиента']));
      scr.appendChild(hd);
      // Кнопки смены статуса
      buildOrderStatusButtons(scr,o,ordId);
    }

    // ── ЗАКАЗ ЗАКРЫТ/ОТМЕНЁН ──
    else{
      const c=ORDER_COLORS[o.status]||['var(--txt2)','rgba(128,128,128,.1)'];
      const hd=el('div',{css:'background:'+c[1]+';border:1px solid '+c[0]+'44;border-radius:14px;padding:14px;text-align:center;margin-bottom:14px;'});
      hd.appendChild(el('div',{css:'font-size:15px;font-weight:700;color:'+c[0]+';'},[clientStatus(o.status)]));
      scr.appendChild(hd);
      buildOrderStatusButtons(scr,o,ordId);
    }
    return;
  }

  // ── СПИСОК ЗАКАЗОВ
  const allOrd=S.adminOrders.length?S.adminOrders:S.orders;
  if(S._ordTab===undefined)S._ordTab=0;
  const tabRow=el('div',{css:'display:flex;gap:8px;margin-bottom:14px;'});
  [['Текущие',0],['Архив',1]].forEach(([lb,i])=>{
    const b=el('div',{cls:'fpill'+(S._ordTab===i?' on':''),css:'position:relative;',
      onClick:()=>{S._ordTab=i;render();}});
    b.textContent=lb;
    // Красный badge если есть заказы требующие внимания
    if(i===0){
      const needAction=allOrd.filter(o=>{
        const ps=o.payState||'';
        return ps==='waiting_requisites'||ps==='paid';
      }).length;
      if(needAction>0){
        b.appendChild(el('div',{css:'position:absolute;top:-4px;right:-4px;background:#ff375f;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;'},[String(needAction)]));
      }
    }
    tabRow.appendChild(b);
  });
  scr.appendChild(tabRow);

  const current=S._ordTab===0;
  const now=Date.now();const sixMo=6*30*24*3600*1000;
  const items=allOrd.filter(o=>{
    const arch=['ЗАКРЫТ','ОТМЕНЁН','Завершён','Отменён'].includes(o.status);
    if(current) return !arch;
    return arch&&(!o.ts||(now-o.ts)<sixMo);
  });

  if(!items.length){
    scr.appendChild(el('div',{css:'text-align:center;padding:40px;color:var(--txt3);font-size:14px;'},
      [current?'Нет активных заказов':'Архив пуст']));
    return;
  }

  items.forEach(o=>{
    const ps=o.payState||'';
    const needsAction=ps==='waiting_requisites'||ps==='paid';
    const st=clientStatus(o.status);
    const c=ORDER_COLORS[o.status]||ORDER_COLORS[st]||['var(--txt3)','rgba(128,128,128,.1)'];

    const card=el('div',{
      css:'background:rgba(255,255,255,.05);border:1.5px solid '+(needsAction?'var(--gold)':'rgba(255,255,255,.08)')+';border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;position:relative;'+(needsAction?'box-shadow:0 0 20px rgba(255,214,10,.15);animation:pulse 2s ease-in-out infinite;':''),
      onClick:()=>{S.adminDetail={_orderId:o.id};render();}
    });

    // Красная полоска если требует внимания
    if(needsAction){
      const dot=el('div',{css:'position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:#ff375f;box-shadow:0 0 8px rgba(255,55,95,.6);'});
      card.appendChild(dot);
    }

    const top=el('div',{css:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;'});
    top.appendChild(el('span',{css:'font-size:14px;font-weight:700;'},['Заказ №'+o.id+' · '+o.date]));
    top.appendChild(el('span',{css:'font-size:13px;font-weight:800;color:var(--accent);'},[o.total.toLocaleString('ru')+' ₽']));
    card.appendChild(top);

    const mid=el('div',{css:'display:flex;justify-content:space-between;align-items:center;'});
    mid.appendChild(el('span',{css:'font-size:12px;color:var(--txt2);'},[o.userName||'—']+' · '+(o.userPhone||'—')));
    const stPill=el('div',{css:'background:'+(needsAction?'rgba(255,214,10,.15)':c[1])+';color:'+(needsAction?'var(--gold)':c[0])+';border-radius:100px;padding:3px 10px;font-size:11px;font-weight:700;'});
    stPill.textContent=needsAction?(ps==='waiting_requisites'?'Нужны реквизиты':'Проверить оплату'):st;
    mid.appendChild(stPill);
    card.appendChild(mid);
    scr.appendChild(card);
  });
}

// Кнопки смены статуса для завершённых заказов
function buildOrderStatusButtons(scr,o,ordId){
  scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt3);font-weight:700;margin-bottom:8px;letter-spacing:.5px;'},['СМЕНИТЬ СТАТУС']));
  const stRow=el('div',{css:'display:flex;gap:5px;flex-wrap:wrap;'});
  ORDER_STATUSES.forEach(st=>{
    const active=o.status===st;
    const b=el('button',{
      css:'padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid '+(active?'var(--accent)':'rgba(255,255,255,.1)')+';background:'+(active?'rgba(238,158,35,.15)':'transparent')+';color:'+(active?'var(--accent)':'var(--txt3)')+';',
      onClick:async()=>{
        const old=o.status;o.status=st;
        addLog('Статус заказа №'+o.id+': '+old+' → '+st,'');
        const kvUpd={status:st};
        if(st==='ОТМЕНЁН'||st==='Отменён'){o.payState='cancelled';kvUpd.payState='cancelled';}
        else if(st==='ЗАКРЫТ'||st==='Завершён'){kvUpd.payState='confirmed';}
        else if(st==='Доставляется'){kvUpd.payState='confirmed';}
        setLocalOrderState(o.id,kvUpd);
        // Пишем в KV чтобы пользователь видел изменение статуса
        try{await fetch('/api/order-state',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'set_order',orderId:String(o.id),data:{...kvUpd,_statusUpdate:Date.now()}})
        });}catch(e){}
        save();render();
      }});
    b.textContent=st;stRow.appendChild(b);
  });
  scr.appendChild(stRow);
}

async function loadAdminSellers(){
  try{
    const r=await fetch('/api/seller',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'list_sellers'})});
    const d=await r.json();
    if(d.ok&&Array.isArray(d.sellers)){S.adminSellers=d.sellers;return true;}
  }catch(e){}
  return false;
}

function buildAdminCatalog(scr){
  scr.appendChild(el('div',{css:'font-size:20px;font-weight:800;margin-bottom:14px;'},['Каталог']));

  // ── Редактор карусели ──────────────────────────────────
  const carSec=el('div',{css:'background:rgba(255,255,255,.04);border-radius:20px;padding:16px;margin-bottom:20px;border:1px solid rgba(255,255,255,.08);'});
  carSec.appendChild(el('div',{css:'font-size:15px;font-weight:800;margin-bottom:4px;'},['Карусель на главной']));
  carSec.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);margin-bottom:12px;'},['Размер слайдов: полная ширина × половина высоты карточки. Менять фото → вставьте URL в поле «Фото».']));

  const slidesWrap=el('div',{id:'admin-carousel-slides'});
  function renderCarouselEditor(){
    slidesWrap.innerHTML='';
    CAROUSEL_SLIDES.forEach((s,i)=>{
      const card=el('div',{css:'background:rgba(255,255,255,.04);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.07);'});

      // Превью
      const prev=el('div',{css:'width:100%;height:52px;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;padding:0 14px;gap:10px;overflow:hidden;position:relative;'});
      prev.style.background=s.bg||'#222';
      if(s.imgUrl){const img=document.createElement('img');img.src=s.imgUrl;img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;';prev.appendChild(img);}
      const prevTxt=el('div',{css:'position:relative;z-index:1;'});
      prevTxt.appendChild(el('div',{css:'font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);'},[s.title||'—']));
      if(s.sub)prevTxt.appendChild(el('div',{css:'font-size:10px;color:rgba(255,255,255,.7);'},[s.sub]));
      prev.appendChild(prevTxt);
      card.appendChild(prev);

      // Поля редактирования
      // Загрузка фото из галереи
      const fileRow=el('div',{css:'margin-bottom:6px;'});
      const fileLabel=el('label',{css:'display:flex;align-items:center;gap:8px;background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.3);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:12px;color:var(--blue);font-weight:600;'});
      fileLabel.textContent='Выбрать фото из галереи';
      const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.style.display='none';
      fileInput.onchange=()=>{
        const file=fileInput.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=e=>{
          s.imgUrl=e.target.result;// base64 data URL
          // Обновляем превью
          prev.style.background=s.bg||'#222';
          const existImg=prev.querySelector('img');
          if(existImg){existImg.src=s.imgUrl;}
          else{const im=document.createElement('img');im.src=s.imgUrl;im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;';prev.appendChild(im);}
          fileLabel.textContent='Фото загружено';
          save();
        };
        reader.readAsDataURL(file);
      };
      fileLabel.appendChild(fileInput);
      fileRow.appendChild(fileLabel);
      card.appendChild(fileRow);
      if(s.imgUrl&&s.imgUrl.startsWith('data:')){const ok=el('div',{css:'font-size:11px;color:var(--green);margin-bottom:4px;'},['Фото загружено']);card.appendChild(ok);}

      const fields=[['Заголовок','title',s.title||''],['Подзаголовок','sub',s.sub||''],['Эмодзи (если нет фото)','emoji',s.emoji||''],['Фон (CSS цвет, если нет фото)','bg',s.bg||'']];
      fields.forEach(([lb,key,val])=>{
        const inp=el('input',{cls:'inp',placeholder:lb,css:'margin-bottom:6px;font-size:12px;padding:8px 12px;'});
        inp.value=val;
        inp.oninput=()=>{s[key]=inp.value;
          // Обновляем превью без render()
          prev.style.background=s.bg||'#222';
          prevTxt.querySelector('div').textContent=s.title||'—';
        };
        card.appendChild(inp);
      });

      // Кнопки порядка + удалить

// 1) Читаем параметр реквизитов из URL (?req=base64)
(function checkReqParam(){
  try{
    const urlParams=new URLSearchParams(window.location.search);
    const req=urlParams.get('req');
    if(!req)return;
    const decoded=JSON.parse(atob(req.replace(/-/g,'+').replace(/_/g,'/')));
    if(decoded.t==='req'&&decoded.oid){
      const ordId=Number(decoded.oid)||decoded.oid;
      const order=S.orders.find(o=>String(o.id)===String(decoded.oid));
      if(order){
        const bank=BANKS.find(b=>b.id===decoded.bankId)||BANKS.find(b=>b.name===decoded.bank)||BANKS[0];
        S.checkout={
          step:5, orderId:ordId, total:order.total, disc:order.disc||0,
          receiver:order.receiver||'me', otherName:'', otherPhone:'', addrIdx:0,
          payBank:bank, payPhone:decoded.phone||'—', payName:decoded.name||'—',
          payStatus:null, msgIdx:0, _paidEnabled:true, _deadline:Date.now()+5*60*1000,
        };
        setLocalOrderState(ordId,{payState:'requisites_sent',payBankId:bank.id,payBank:bank.name,payPhone:decoded.phone,payName:decoded.name});
        window.history.replaceState({},'',window.location.pathname);
      }
    }
  }catch(e){}
})();

// СИНХРОНИЗАЦИЯ ДАННЫХ ДЛЯ АДМИНКИ
// ══════════════════════════════════════════
async function syncAdminData(){
  if(!S.adminMode)return;
  try{
    const [rOrders,rUsers,rChats]=await Promise.all([
      fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_orders'})}),
      fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_users'})}),
      fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_chats'})}),
    ]);
    const [dO,dU,dC]=await Promise.all([rOrders.json(),rUsers.json(),rChats.json()]);
    let changed=false;
    if(dO.ok&&Array.isArray(dO.orders)){
      // Проверяем реальное изменение по количеству и последнему ts
      const newTs=dO.orders.map(o=>o._created||o.ts||0).join(',');
      const oldTs=S.adminOrders.map(o=>o._created||o.ts||0).join(',');
      if(newTs!==oldTs){S.adminOrders=dO.orders;changed=true;}
    }
    if(dU.ok&&Array.isArray(dU.users)){
      if(dU.users.length!==S.adminUsers.length){S.adminUsers=dU.users;changed=true;}
    }
    if(dC.ok&&Array.isArray(dC.chats)){
      const newCTs=dC.chats.map(c=>c._updated||0).join(',');
      const oldCTs=S.adminChats.map(c=>c._updated||0).join(',');
      if(newCTs!==oldCTs){S.adminChats=dC.chats;changed=true;}
    }
    if(!changed)return;
    // Бесшовное обновление — обновляем только счётчики/badges без полного render()
    _patchAdminBadges();
    // Если открыта вкладка (не детальная страница) — тихо перерисовываем только контент вкладки
    if(S.adminMode&&!S.adminDetail){
      const body=document.getElementById('admin-tab-body');
      if(body){
        body.innerHTML='';
        [buildAdminDash,buildAdminOrders,buildAdminUsers,buildAdminCatalog,buildAdminLogs,buildAdminChats,buildAdminSellers][S.adminTab]?.(body);
      }
    }
  }catch(e){console.error('syncAdminData err:',e);}
}

function _patchAdminBadges(){
  // Обновляем badge на кнопке Заказы без перерисовки всей страницы
  const allOrd=S.adminOrders.length?S.adminOrders:S.orders;
  const pending=allOrd.filter(o=>o.payState==='waiting_requisites'||o.payState==='paid').length;
  const unreadC=S.adminChats.filter(c=>c.status!=='Закрыт'&&(c.msgs||[]).some(m=>m.adminUnread)).length;
  document.querySelectorAll('[data-admin-badge-orders]').forEach(el=>{
    el.textContent=pending>0?String(pending):'';el.style.display=pending>0?'':'none';
  });
  document.querySelectorAll('[data-admin-badge-chats]').forEach(el=>{
    el.textContent=unreadC>0?String(unreadC):'';el.style.display=unreadC>0?'':'none';
  });
}

function getSellerStats(){
  const orders=getSellerOrders();
  const total=orders.reduce((s,o)=>s+(o.total||0),0);
  const avgCheck=orders.length?Math.round(total/orders.length):0;
  const itemCounts={};
  orders.forEach(o=>Object.entries(o.items||{}).forEach(([name,qty])=>{itemCounts[name]=(itemCounts[name]||0)+qty;}));
  const topItem=Object.entries(itemCounts).sort((a,b)=>b[1]-a[1])[0];
  const today=new Date().toLocaleDateString('ru');
  const newToday=orders.filter(o=>o.date===today&&o.section==='new').length;
  const archived=orders.filter(o=>o.section==='archive');
  const conversionPct = orders.length ? Math.round((archived.length/orders.length)*100)+'%' : '—';

  // ── Выручка по дням за последние 7 дней (для графика) ──
  const dayMap={};
  orders.forEach(o=>{ if(o.date){ dayMap[o.date]=(dayMap[o.date]||0)+(o.total||0); } });
  const last7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toLocaleDateString('ru');
    last7.push({label:key.slice(0,5), value:dayMap[key]||0});
  }

  return {
    revenue:total, ordersCount:orders.length, avgCheck,
    topItem: topItem?topItem[0]:'—', topItemQty: topItem?topItem[1]:0,
    rating: orders.length?4.8:'—', conversion:conversionPct, newToday, returns:0,
    chartData:last7
  };
}

// ── Мини-график выручки по дням (SVG, без внешних либ) ──
function buildRevenueChart(chartData){
  const w=320,h=120,pad=8;
  const max=Math.max(1,...chartData.map(d=>d.value));
  const barW=(w-pad*2)/chartData.length-6;
  let bars='';
  chartData.forEach((d,i)=>{
    const bh=Math.max(2,(d.value/max)*(h-30));
    const x=pad+i*((w-pad*2)/chartData.length);
    const y=h-26-bh;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="${d.value>0?'#30d158':'rgba(255,255,255,.08)'}"/>`;
    bars+=`<text x="${x+barW/2}" y="${h-10}" font-size="9" fill="rgba(255,255,255,.4)" text-anchor="middle">${d.label}</text>`;
  });
  const svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${bars}</svg>`;
  const wrap=document.createElement('div');
  wrap.innerHTML=svg;
  return wrap;
}

// ── Реальные заказы продавца из KV (а не демо-заглушка) ──
function getSellerOrders(){
  if(!S.sellerOrders) S.sellerOrders=[];
  return S.sellerOrders;
}

async function loadSellerOrders(){
  if(!S.sellerUser||!S.sellerUser.login)return;
  try{
    const r=await fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_seller_orders',sellerLogin:S.sellerUser.login})});
    const d=await r.json();
    if(d.ok&&Array.isArray(d.orders)){
      // Размечаем секцию по статусу, если её ещё нет (первая загрузка реального заказа)
      S.sellerOrders=d.orders.map(o=>{
        if(!o.section){
          if(o.status==null||o.payState==='waiting_requisites') o.section='new';
          else if(['Уехал','Завершён','ОТМЕНЁН','Отменён'].includes(o.status)) o.section='archive';
          else o.section='active';
        }
        return o;
      });
    }
  }catch(e){}
}

function buildSellerApp(){
  const page=el('div',{cls:'seller-app-page',css:'position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;font-family:inherit;'});

  // ── ЭКРАН АВТОРИЗАЦИИ ─────────────────────────────────────
  if(!S.sellerUser){
    if(S.sellerScreen==='auth') return buildSellerAuth(page);
    if(S.sellerScreen==='register') return buildSellerRegister(page);
    if(S.sellerScreen==='login') return buildSellerLogin(page);
    return buildSellerAuth(page);
  }

  // ── КАБИНЕТ ───────────────────────────────────────────────
  const TABS=[['📦','Заказы'],['🌸','Товары'],['📣','Промо'],['🔔','Уведомления'],['📊','Стат']];
  if(S.sellerTab===undefined)S.sellerTab=0;

  if(S._sellerSettingsOpen) return buildSellerSettings(page);

  // Шапка
  const hdr=el('div',{css:'display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0;gap:8px;'});
  hdr.appendChild(el('div',{css:'font-size:16px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'},[S.sellerUser.shopName||'Мой магазин']));
  const gearB=el('button',{css:'background:none;border:none;color:var(--txt2);font-size:18px;cursor:pointer;padding:4px 8px;',
    onClick:()=>{S._sellerSettingsOpen=true;render();}});
  gearB.textContent='⚙️';hdr.appendChild(gearB);
  const exitB=el('button',{css:'background:none;border:none;color:var(--txt3);font-size:13px;cursor:pointer;padding:4px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);',
    onClick:()=>{S.sellerMode=false;S.sellerUser=null;S.sellerScreen='auth';S.sellerTab=0;S._sellerOrdersLoaded=false;
      if(S._sellerOrdersPollTimer){clearInterval(S._sellerOrdersPollTimer);S._sellerOrdersPollTimer=null;}
      render();}});
  exitB.textContent='Выйти';hdr.appendChild(exitB);page.appendChild(hdr);

  // Таббар
  const tabBar=el('div',{css:'display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0;'});
  TABS.forEach(([ic,lb],i)=>{
    const t=el('div',{css:'flex:1;text-align:center;padding:10px 4px;cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;border-bottom:2px solid '+(S.sellerTab===i?'var(--accent)':'transparent')+';color:'+(S.sellerTab===i?'var(--accent)':'var(--txt3)'),
      onClick:()=>{S.sellerTab=i;render();}});
    t.innerHTML='<div style="font-size:18px;margin-bottom:2px">'+ic+'</div>'+lb;
    tabBar.appendChild(t);
  });
  page.appendChild(tabBar);

  // Подгружаем реальные заказы продавца, если ещё не загружены (например, сессия восстановлена)
  if(S.sellerUser&&!S._sellerOrdersLoaded){
    S._sellerOrdersLoaded=true;
    loadSellerOrders().then(()=>{
      const b=document.getElementById('seller-tab-body');
      if(b){b.innerHTML='';
        if(S.sellerTab===0)buildSellerOrders(b);
        else if(S.sellerTab===1)buildSellerProducts(b);
        else if(S.sellerTab===4)buildSellerDashboard(b);
      }
    });
  }

  const body=el('div',{id:'seller-tab-body',css:'flex:1;overflow-y:auto;padding:16px 14px 40px;'});
  if(S.sellerTab===0) buildSellerOrders(body);
  else if(S.sellerTab===1) buildSellerProducts(body);
  else if(S.sellerTab===2) buildSellerPromo(body);
  else if(S.sellerTab===3) buildSellerNotifications(body);
  else if(S.sellerTab===4) buildSellerDashboard(body);
  page.appendChild(body);
  return page;
}

function buildSellerProducts(body){
  if(!S.sellerUser)return;
  const login=S.sellerUser.login;

  // Инициализируем хранилище товаров
  if(!S._spLoaded){
    S._spLoaded=true;
    fetch('/api/seller-products',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'get',login})})
    .then(async r=>{
      const d=await r.json();
      if(!d.ok){S._spItems=[];return;}
      const products=d.products||[];
      // Резолвим ключи фото из KV обратно в реальные data-URL
      const keys=new Set();
      products.forEach(p=>{
        if(p.imgKey)keys.add(p.imgKey);
        (p.imagesKeys||[]).forEach(k=>keys.add(k));
      });
      let images={};
      if(keys.size){
        try{
          const ir=await fetch('/api/images',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'get_batch',keys:[...keys]})});
          const id=await ir.json();
          if(id.ok)images=id.images||{};
        }catch(e){}
      }
      products.forEach(p=>{
        const gallery=(p.imagesKeys&&p.imagesKeys.length?p.imagesKeys:(p.imgKey?[p.imgKey]:[]))
          .map(k=>images[k]).filter(Boolean);
        p.images=gallery;
        p.imgUrl=gallery[0]||(p.imgUrl&&p.imgUrl!=='__kv__'?p.imgUrl:'');
      });
      S._spItems=products;
    })
    .catch(()=>{S._spItems=S._spItems||[];})
    .finally(()=>{
      const b=document.getElementById('seller-tab-body');
      if(b&&S.sellerTab===1){b.innerHTML='';buildSellerProducts(b);}
    });
    S._spItems=S._spItems||[];
  }

  const items=S._spItems||[];

  // ── Шапка с поиском и кнопками режима ──
  const topBar=el('div',{css:'display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;'});
  topBar.appendChild(el('div',{css:'font-size:20px;font-weight:800;flex:1;'},['Мои товары']));
  body.appendChild(topBar);

  // Строка поиска
  const searchRow=el('div',{css:'display:flex;gap:8px;margin-bottom:12px;'});
  const spInp=el('input',{cls:'inp',css:'flex:1;font-size:13px;',placeholder:'Поиск по названию, типу, тегу...'});
  spInp.value=S._spSearch||'';
  spInp.oninput=()=>{S._spSearch=spInp.value;refreshProducts();};
  searchRow.appendChild(spInp);
  body.appendChild(searchRow);

  // Фильтры
  const filterRow=el('div',{css:'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;'});
  const FILTERS=[['all','Все'],['stopped','В стопе'],['low','Заканчиваются (<5)']];
  if(!S._spFilter)S._spFilter='all';
  FILTERS.forEach(([k,lb])=>{
    const b=el('div',{cls:'fpill'+(S._spFilter===k?' on':''),css:'cursor:pointer;font-size:12px;',
      onClick:()=>{S._spFilter=k;rebuildFilterRow();refreshProducts();}});
    b.textContent=lb;filterRow.appendChild(b);
  });
  function rebuildFilterRow(){
    filterRow.innerHTML='';
    FILTERS.forEach(([k,lb])=>{
      const b=el('div',{cls:'fpill'+(S._spFilter===k?' on':''),css:'cursor:pointer;font-size:12px;',
        onClick:()=>{S._spFilter=k;rebuildFilterRow();refreshProducts();}});
      b.textContent=lb;filterRow.appendChild(b);
    });
    // Сортировка
    const sortSel=document.createElement('select');
    sortSel.style.cssText='background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:12px;color:var(--txt);cursor:pointer;';
    [['sold_desc','Популярные'],['price_asc','Цена ↑'],['price_desc','Цена ↓'],['stock_asc','Остаток ↑'],['name_asc','По имени']].forEach(([v,l])=>{
      const o=document.createElement('option');o.value=v;o.textContent=l;
      if(S._spSort===v)o.selected=true;sortSel.appendChild(o);
    });
    sortSel.onchange=()=>{S._spSort=sortSel.value;refreshProducts();};
    filterRow.appendChild(sortSel);
  }
  if(!S._spSort)S._spSort='sold_desc';
  rebuildFilterRow();
  body.appendChild(filterRow);

  // Кнопки добавления
  const addBar=el('div',{css:'display:flex;gap:8px;margin-bottom:16px;'});
  const addManualB=el('button',{cls:'btn-prim',css:'flex:1;font-size:13px;',onClick:()=>{S._spEditItem=null;S._spMode='edit';const b=document.getElementById('seller-tab-body');if(b){b.innerHTML='';buildSellerProductEdit(b,null,login);}}});
  addManualB.textContent='+ Добавить вручную';addBar.appendChild(addManualB);
  const importB=el('button',{cls:'btn-glass',css:'flex:1;font-size:13px;',onClick:()=>{S._spMode='import';const b=document.getElementById('seller-tab-body');if(b){b.innerHTML='';buildSellerProductImport(b,login);}}});
  importB.textContent='Загрузить таблицу';addBar.appendChild(importB);
  const tmplB=el('button',{cls:'btn-glass',css:'font-size:12px;padding:10px;',onClick:async()=>{
    // Генерируем ссылку на шаблон
    tmplB.textContent='⏳';
    try{
      const resp=await fetch('/api/seller-products',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'template'})});
      // Fallback — ссылка на заранее загруженный шаблон
      showNotif('Шаблон: скачайте venets_products_template.xlsx из вашего деплоя','');
    }catch(e){}
    tmplB.textContent='Шаблон';
  }});
  tmplB.textContent='Шаблон';addBar.appendChild(tmplB);
  body.appendChild(addBar);

  // Сетка товаров
  const grid=el('div',{id:'sp-grid',css:'display:grid;grid-template-columns:1fr 1fr;gap:10px;'});
  body.appendChild(grid);

  function refreshProducts(){
    const q=(S._spSearch||'').toLowerCase().trim();
    let list=[...(S._spItems||[])];
    if(S._spFilter==='stopped') list=list.filter(p=>p.stopped);
    else if(S._spFilter==='low') list=list.filter(p=>(p.stock||0)<5);
    if(q) list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.type||'').toLowerCase().includes(q)||(p.tags||'').toLowerCase().includes(q));
    if(S._spSort==='price_asc') list.sort((a,b)=>(a.price||0)-(b.price||0));
    else if(S._spSort==='price_desc') list.sort((a,b)=>(b.price||0)-(a.price||0));
    else if(S._spSort==='stock_asc') list.sort((a,b)=>(a.stock||0)-(b.stock||0));
    else if(S._spSort==='name_asc') list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    else list.sort((a,b)=>(b.sold||0)-(a.sold||0));

    grid.innerHTML='';
    if(!list.length){
      const empty=el('div',{css:'grid-column:span 2;text-align:center;padding:60px 20px;color:var(--txt3);'});
      empty.innerHTML='<div style="font-size:48px;margin-bottom:12px"></div><div style="font-size:16px;font-weight:700">Товаров нет</div><div style="font-size:13px;margin-top:6px">Добавьте первый товар</div>';
      grid.appendChild(empty);return;
    }
    list.forEach(p=>grid.appendChild(buildSellerProductCard(p,login)));
  }
  refreshProducts();
}

function buildSellerProductCard(p,login){
  const card=el('div',{css:'background:var(--bg2);border:1px solid '+(p.stopped?'rgba(255,55,95,.4)':'var(--border)')+';border-radius:18px;overflow:hidden;position:relative;'+(p.stopped?'opacity:.6;':'')});

  // Фото / эмодзи

function parseImportFile(text,name){
  try{
    // Простой CSV-парсер (для .csv файлов)
    const lines=text.split('\n').filter(l=>l.trim());
    if(!lines.length)return[];
    // Пропускаем строки-инструкции (первые 3 в шаблоне) и заголовок
    let headerIdx=0;
    for(let i=0;i<Math.min(5,lines.length);i++){
      if(lines[i].includes('section')&&lines[i].includes('name')&&lines[i].includes('price')){headerIdx=i;break;}
    }
    const headers=lines[headerIdx].split(',').map(h=>h.trim().replace(/"/g,''));
    const result=[];
    for(let i=headerIdx+1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      if(!cols[headers.indexOf('name')]&&!cols[1])continue;
      const obj={};
      headers.forEach((h,idx)=>{if(h)obj[h]=cols[idx]||'';});
      if(obj.price)obj.price=+obj.price||0;
      if(obj.stock)obj.stock=+obj.stock||0;
      if(obj.rating)obj.rating=+obj.rating||4.8;
      if(obj.stopped)obj.stopped=obj.stopped==='TRUE';
      if(obj.vegan)obj.vegan=obj.vegan==='TRUE';
      if(obj.halal)obj.halal=obj.halal==='TRUE';
      if(obj.noNuts)obj.noNuts=obj.noNuts==='TRUE';
      if(obj.name)result.push(obj);
    }
    return result;
  }catch(e){return[];}
}

  });
  sec2.appendChild(widgetRow);body.appendChild(sec2);

  const sec3=el('div',{css:'background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:20px;'});

   ['notifyFollow','Уведомления подписчикам','Отправим пуш когда появится новый товар']].forEach(([key,lb,desc])=>{

    const txt=el('div',{css:'flex:1;'});
    txt.appendChild(el('div',{css:'font-size:13px;font-weight:600;'},[lb]));

    row.appendChild(txt);
    const tog=el('div',{css:'width:42px;height:24px;border-radius:100px;position:relative;cursor:pointer;transition:all .2s;flex-shrink:0;background:'+(S._promoSel[key]?'var(--accent)':'rgba(255,255,255,.15)'),
      onClick:()=>{S._promoSel[key]=!S._promoSel[key];tog.style.background=S._promoSel[key]?'var(--accent)':'rgba(255,255,255,.15)';thumb.style.left=S._promoSel[key]?'21px':'3px';}});
    const thumb=el('div',{css:'width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:'+(S._promoSel[key]?'21px':'3px')+';transition:all .2s;'});
    tog.appendChild(thumb);row.appendChild(tog);sec3.appendChild(row);
  });
  body.appendChild(sec3);

  // Кнопка «Подать заявку»
  const total=Object.values(S._promoSel||{}).filter(Boolean).length;
  const applyB=el('button',{cls:total?'btn-prim':'btn-glass',css:'width:100%;',onClick:()=>{
    if(!total){showNotif('Выберите хотя бы один инструмент','⚠️');return;}
    showNotif('Заявка на продвижение отправлена! Свяжемся в течение 24ч ');
  }});
  applyB.textContent=total?'Подать заявку (выбрано: '+total+')':'Выберите инструменты';
  body.appendChild(applyB);

  function rebuildPromo(){const b=document.getElementById('seller-tab-body');if(b){b.innerHTML='';buildSellerPromo(b);}}
}

function buildSellerSettings(page){
  const back=el('button',{css:'position:absolute;top:16px;left:16px;background:none;border:none;color:var(--txt2);font-size:24px;cursor:pointer;z-index:2;',
    onClick:()=>{S._sellerSettingsOpen=false;render();}});
  back.textContent='‹';page.appendChild(back);
  const scr=el('div',{cls:'scroll',css:'padding:56px 20px 40px;'});
  scr.appendChild(el('div',{css:'font-size:22px;font-weight:900;margin-bottom:24px;'},['Настройки магазина']));

  const u=S.sellerUser;
  scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:6px;'},['Название магазина']));
  const nameI=el('input',{cls:'inp',css:'margin-bottom:18px;'});nameI.value=u.shopName||'';
  scr.appendChild(nameI);

  scr.appendChild(el('div',{css:'font-size:14px;font-weight:800;margin-bottom:10px;margin-top:8px;'},['Доступ']));
  scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:6px;'},['Логин']));
  const loginI=el('input',{cls:'inp',css:'margin-bottom:14px;'});loginI.value=u.login||'';
  scr.appendChild(loginI);
  scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:6px;'},['Новый пароль (оставьте пустым чтобы не менять)']));
  const passI=el('input',{cls:'inp',css:'margin-bottom:18px;',type:'password',placeholder:'••••••••'});
  scr.appendChild(passI);

  // ── Координаты магазина (для расчёта доставки OSRM) ──
  scr.appendChild(el('div',{css:'font-size:14px;font-weight:800;margin-bottom:10px;margin-top:8px;'},['Координаты магазина']));
  const coordRow=el('div',{css:'display:flex;gap:8px;margin-bottom:6px;'});
  const latI2=el('input',{cls:'inp',css:'flex:1;',placeholder:'Широта'});latI2.value=u.lat!=null?String(u.lat):'';
  const lonI2=el('input',{cls:'inp',css:'flex:1;',placeholder:'Долгота'});lonI2.value=u.lon!=null?String(u.lon):'';
  coordRow.appendChild(latI2);coordRow.appendChild(lonI2);
  scr.appendChild(coordRow);
  const geoBtn2=el('button',{cls:'btn-glass',css:'margin-bottom:14px;font-size:13px;padding:10px;',onClick:()=>{
    if(!navigator.geolocation){showNotif('Геолокация недоступна','⚠️');return;}
    geoBtn2.textContent='Определяем...';
    navigator.geolocation.getCurrentPosition(pos=>{
      latI2.value=pos.coords.latitude.toFixed(6);
      lonI2.value=pos.coords.longitude.toFixed(6);
      geoBtn2.textContent='Определить автоматически';
      showNotif('Координаты определены','');
    },()=>{geoBtn2.textContent='Определить автоматически';showNotif('Не удалось определить','⚠️');},{timeout:8000});
  }});
  geoBtn2.textContent='Определить автоматически';scr.appendChild(geoBtn2);

  // ── Ссылка на оплату ──
  scr.appendChild(el('div',{css:'font-size:14px;font-weight:800;margin-bottom:10px;margin-top:18px;'},['Ссылка на оплату']));
  const linkI2=el('input',{cls:'inp',css:'margin-bottom:18px;',placeholder:'https://qr.nspk.ru/...'});
  linkI2.value=u.staticPaymentLink||'';
  scr.appendChild(linkI2);

  const msg=el('div',{css:'font-size:13px;text-align:center;margin-bottom:10px;min-height:18px;'});
  scr.appendChild(msg);

  const saveB=el('button',{cls:'btn-prim',css:'width:100%;margin-bottom:24px;',onClick:async()=>{
    if(!nameI.value.trim()||!loginI.value.trim()){msg.style.color='var(--pink)';msg.textContent='Заполните название и логин';return;}
    saveB.disabled=true;saveB.textContent='Сохраняем...';
    try{
      const r=await fetch('/api/seller',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          action:'update_settings', login:u.login,
          newShopName:nameI.value.trim(), newLogin:loginI.value.trim(),
          newPassword:passI.value.trim()||undefined,
          newLat:latI2.value.trim(), newLon:lonI2.value.trim(),
          newPaymentLink:linkI2.value.trim()
        })});
      const d=await r.json();
      if(d.ok){
        S.sellerUser={...S.sellerUser, shopName:d.seller.shopName, login:d.seller.login,
          lat:d.seller.lat, lon:d.seller.lon, staticPaymentLink:d.seller.staticPaymentLink};
        msg.style.color='var(--green)';msg.textContent='Сохранено';
        showNotif('Настройки обновлены','');
      }else if(d.error==='login_taken'){
        msg.style.color='var(--pink)';msg.textContent='Такой логин уже занят';
      }else{
        msg.style.color='var(--pink)';msg.textContent='Ошибка сохранения';
      }
    }catch(e){
      S.sellerUser={...S.sellerUser, shopName:nameI.value.trim(), login:loginI.value.trim()};
      msg.style.color='var(--green)';msg.textContent='Сохранено (демо)';
    }
    saveB.disabled=false;saveB.textContent='Сохранить изменения';
  }});
  saveB.textContent='Сохранить изменения';scr.appendChild(saveB);

  // ── Конструктор виджетов дашборда (вкл/выкл, размер, порядок) ──
  scr.appendChild(el('div',{css:'font-size:14px;font-weight:800;margin-bottom:10px;'},['Виджеты дашборда']));
  scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);margin-bottom:14px;line-height:1.5;'},['Настройте дашборд как виджеты на смартфоне: включайте/выключайте, меняйте размер тапом по значку, переставляйте порядок стрелками.']));
  if(!S.sellerWidgets) S.sellerWidgets=DEFAULT_SELLER_WIDGETS.map(w=>({...w}));

  const SIZE_CYCLE={small:'medium',medium:'large',large:'small'};
  const SIZE_LABEL={small:'S',medium:'M',large:'L'};
  const SIZE_COLOR={small:'#8e8e93',medium:'#0a84ff',large:'#ee9e23'};

  const widgetsWrap=el('div',{id:'seller-widgets-list'});
  function renderWidgetsList(){
    widgetsWrap.innerHTML='';
    S.sellerWidgets.forEach((w,idx)=>{
      const row=el('div',{css:'display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.04);border-radius:14px;margin-bottom:8px;'+(w.enabled?'':'opacity:.5;')});

      // Стрелки порядка
      const arrows=el('div',{css:'display:flex;flex-direction:column;gap:2px;'});
      const upB=el('div',{css:'cursor:pointer;font-size:13px;color:'+(idx===0?'rgba(255,255,255,.2)':'var(--txt2)')+';line-height:1;padding:2px;',
        onClick:()=>{if(idx>0){[S.sellerWidgets[idx-1],S.sellerWidgets[idx]]=[S.sellerWidgets[idx],S.sellerWidgets[idx-1]];save();renderWidgetsList();}}});
      upB.textContent='▲';
      const downB=el('div',{css:'cursor:pointer;font-size:13px;color:'+(idx===S.sellerWidgets.length-1?'rgba(255,255,255,.2)':'var(--txt2)')+';line-height:1;padding:2px;',
        onClick:()=>{if(idx<S.sellerWidgets.length-1){[S.sellerWidgets[idx+1],S.sellerWidgets[idx]]=[S.sellerWidgets[idx],S.sellerWidgets[idx+1]];save();renderWidgetsList();}}});
      downB.textContent='▼';
      arrows.appendChild(upB);arrows.appendChild(downB);
      row.appendChild(arrows);

      // Название
      const nameWrap=el('div',{css:'flex:1;font-size:13px;font-weight:600;'},[w.icon+' '+w.title]);
      row.appendChild(nameWrap);

      // Размер — тап циклит S→M→L→S
      const sizeBadge=el('div',{css:'width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;background:'+SIZE_COLOR[w.size]+'22;color:'+SIZE_COLOR[w.size]+';border:1px solid '+SIZE_COLOR[w.size]+'55;',
        onClick:()=>{w.size=SIZE_CYCLE[w.size]||'small';renderWidgetsList();}});
      sizeBadge.textContent=SIZE_LABEL[w.size]||'S';
      row.appendChild(sizeBadge);

      // Тумблер вкл/выкл
      const toggle=el('div',{css:'width:42px;height:24px;border-radius:100px;position:relative;cursor:pointer;transition:all .2s;flex-shrink:0;background:'+(w.enabled?'#30d158':'rgba(255,255,255,.15)'),
        onClick:()=>{w.enabled=!w.enabled;renderWidgetsList();}});
      toggle.appendChild(el('div',{css:'width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:'+(w.enabled?'21px':'3px')+';transition:all .2s;'}));
      row.appendChild(toggle);

      widgetsWrap.appendChild(row);
    });
  }
  renderWidgetsList();
  scr.appendChild(widgetsWrap);

  const resetWidgetsB=el('button',{cls:'btn-glass',css:'width:100%;margin-top:6px;font-size:12px;padding:10px;',
    onClick:()=>{S.sellerWidgets=DEFAULT_SELLER_WIDGETS.map(w=>({...w}));renderWidgetsList();showNotif('Сброшено к умолчаниям','↺');}});
  resetWidgetsB.textContent='↺ Сбросить порядок и размеры';scr.appendChild(resetWidgetsB);

  page.appendChild(scr);return page;
}

function buildSellerAuth(page){
  const scr=el('div',{css:'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;'});
  const back=el('button',{css:'position:absolute;top:16px;left:16px;background:none;border:none;color:var(--txt2);font-size:24px;cursor:pointer;z-index:2;',onClick:()=>{S.sellerMode=false;render();}});
  back.textContent='‹';page.appendChild(back);

  // ── Плавающее уведомление о результате заявки ──
  if(S._sellerAppId && !S._sellerAppDismissed){
    const banner=el('div',{id:'seller-float-banner',css:'position:absolute;top:54px;left:14px;right:14px;z-index:10;background:rgba(30,30,38,.97);backdrop-filter:blur(20px);border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);'});
    banner.innerHTML='<div style="font-size:13px;color:var(--txt2);"> Проверяем статус заявки...</div>';
    page.appendChild(banner);

    const pollOnce=async()=>{
      try{
        const r=await fetch('/api/seller',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'check_app',shortId:S._sellerAppId})});
        const d=await r.json();
        const b=document.getElementById('seller-float-banner');
        if(!b||!d.ok)return;
        if(d.status==='approved'){
          if(S._sellerFloatTimer){clearInterval(S._sellerFloatTimer);S._sellerFloatTimer=null;}
          b.style.background='rgba(48,209,88,.15)';b.style.border='1px solid rgba(48,209,88,.4)';
          b.innerHTML=
            '<div style="display:flex;justify-content:space-between;align-items:start;">'+
            '<div style="text-align:left;">'+
            '<div style="font-size:14px;font-weight:800;color:#30d158;margin-bottom:8px;"> Вам одобрили вступление!</div>'+
            '<div style="font-size:12px;color:var(--txt2);margin-bottom:8px;">Ваш временный логин и пароль:</div>'+
            '<div style="font-family:monospace;font-size:15px;font-weight:800;color:#fff;">'+(d.login||'—')+' / '+(d.pass||'—')+'</div>'+
            '</div>'+
            '<div id="seller-float-close" style="cursor:pointer;color:var(--txt3);font-size:18px;padding:2px 6px;"></div>'+
            '</div>'+
            '<button id="seller-float-login-btn" style="margin-top:12px;width:100%;padding:10px;border-radius:12px;border:none;background:#30d158;color:#000;font-weight:700;font-size:13px;cursor:pointer;">Войти сейчас</button>';
          const closeBtn=document.getElementById('seller-float-close');
          if(closeBtn)closeBtn.onclick=()=>{S._sellerAppDismissed=true;render();};
          const loginBtn=document.getElementById('seller-float-login-btn');
          if(loginBtn)loginBtn.onclick=()=>{
            S._sellerAppDismissed=true;S.sellerScreen='login';
            S._sellerPrefillLogin=d.login;S._sellerPrefillPass=d.pass;
            render();
          };
        }else if(d.status==='rejected'){
          if(S._sellerFloatTimer){clearInterval(S._sellerFloatTimer);S._sellerFloatTimer=null;}
          b.style.background='rgba(255,55,95,.12)';b.style.border='1px solid rgba(255,55,95,.35)';
          b.innerHTML=
            '<div style="display:flex;justify-content:space-between;align-items:start;">'+
            '<div style="text-align:left;font-size:13px;color:var(--txt2);"><b style="color:#ff375f;">❌ Заявка отклонена</b><br>Вы можете подать заявку повторно.</div>'+
            '<div id="seller-float-close2" style="cursor:pointer;color:var(--txt3);font-size:18px;padding:2px 6px;"></div></div>';
          const closeBtn2=document.getElementById('seller-float-close2');
          if(closeBtn2)closeBtn2.onclick=()=>{S._sellerAppDismissed=true;render();};
        }
      }catch(e){}
    };
    pollOnce();
    if(!S._sellerFloatTimer) S._sellerFloatTimer=setInterval(pollOnce,5000);
  }

  scr.appendChild(el('div',{css:'font-size:48px;margin-bottom:16px;'},['']));
  scr.appendChild(el('div',{css:'font-size:24px;font-weight:900;margin-bottom:8px;'},['Кабинет продавца']));
  scr.appendChild(el('div',{css:'font-size:14px;color:var(--txt2);margin-bottom:40px;line-height:1.6;'},['Продавайте цветы миллионам\nпокупателей через Venets']));
  const regB=el('button',{cls:'btn-prim',css:'width:100%;margin-bottom:12px;',onClick:()=>{S.sellerScreen='register';render();}});
  regB.textContent='Подать заявку';scr.appendChild(regB);
  const loginB=el('button',{cls:'btn-glass',css:'width:100%;',onClick:()=>{S.sellerScreen='login';render();}});
  loginB.textContent='Войти';scr.appendChild(loginB);

      scr.appendChild(inp);
    });

    // ── Координаты магазина (нужны для расчёта доставки через OSRM) ──
    scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:600;margin-top:16px;'},['Координаты магазина (для расчёта доставки)']));

      if(!navigator.geolocation){showNotif('Геолокация недоступна в этом браузере','⚠️');return;}

          onClick:()=>{
            if(f.flowers.includes(ft))f.flowers=f.flowers.filter(x=>x!==ft);
            else f.flowers.push(ft);
            rebuildFlowerPills(); // патчим только список, без render()
          }});
        pill.textContent=(sel?' ':'')+ft;flWrap.appendChild(pill);
      });
    }
    rebuildFlowerPills();
    scr.appendChild(flWrap);

    // Сегмент
    scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);margin-bottom:8px;font-weight:600;margin-top:16px;'},['Ценовой сегмент']));
    const segWrap=el('div',{css:'display:flex;gap:8px;'});
    function rebuildSegment(){
      segWrap.innerHTML='';
      [['','Эконом'],['','Средний'],['','Премиум']].forEach(([ic,lb])=>{
        const sel=f.segment===lb;
        const b=el('div',{css:'flex:1;text-align:center;padding:12px 4px;border-radius:16px;cursor:pointer;font-size:13px;font-weight:700;border:1.5px solid '+(sel?'var(--accent)':'rgba(255,255,255,.1)')+';background:'+(sel?'rgba(238,158,35,.12)':'rgba(255,255,255,.04)'),
          onClick:()=>{f.segment=lb;rebuildSegment();}});
        b.innerHTML='<div style="font-size:22px;margin-bottom:4px">'+ic+'</div>'+lb;
        segWrap.appendChild(b);
      });
    }
    rebuildSegment();
    scr.appendChild(segWrap);

    // Комментарий
    scr.appendChild(el('div',{css:'font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:600;margin-top:16px;'},['Комментарий (необязательно)']));
    const comm=document.createElement('textarea');
    comm.className='inp';comm.placeholder='Любая дополнительная информация о магазине...';
    comm.style.cssText='height:80px;resize:none;font-family:inherit;';
    comm.value=f.comment||'';comm.oninput=()=>{f.comment=comm.value;};
    scr.appendChild(comm);

    const cont=el('button',{cls:'btn-prim',css:'width:100%;margin-top:24px;',onClick:async()=>{
      if(!f.inn||!f.shopName||!f.phone||!f.address){showNotif('Заполните все обязательные поля','⚠️');return;}
      if(!f.flowers||!f.flowers.length){showNotif('Выберите хотя бы один сорт цветов','⚠️');return;}
      if(!f.segment){showNotif('Выберите ценовой сегмент','⚠️');return;}
      cont.disabled=true;cont.textContent='Отправляем...';
      // Отправляем заявку администратору
      try{
        const r=await fetch('/api/seller',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'apply',form:f,tgId:getTgId(),userName:S.user?.name||'—'})});
        const d=await r.json();
        if(d.shortId) S._sellerAppId=d.shortId; // shortId используется как ключ
        else if(d.appId) S._sellerAppId=d.appId;

      S._sellerRegStep=2;render();
    }});
    cont.textContent='Отправить заявку →';scr.appendChild(cont);
  }

  // Шаг 2 — успех + polling статуса
  else{
    const appId=S._sellerAppId;
    const ok=el('div',{css:'text-align:center;padding:60px 20px;'});
    ok.appendChild(el('div',{css:'font-size:64px;margin-bottom:16px;'},['⏳']));
    ok.appendChild(el('div',{css:'font-size:22px;font-weight:800;margin-bottom:12px;'},['Заявка отправлена!']));

    // Блок статуса — обновляется при ответе
    const statusBox=el('div',{id:'seller-app-status',css:'background:rgba(255,255,255,.06);border-radius:20px;padding:20px;margin:16px 0 24px;text-align:left;'});
    statusBox.innerHTML='<div style="font-size:13px;color:var(--txt2);line-height:1.7;"> Ожидаем решения администратора...<br>Обычно это занимает до 24 часов.<br>Логин и пароль придут в Telegram — <b>не закрывайте это окно</b>.</div>';
    ok.appendChild(statusBox);

    const b=el('button',{cls:'btn-glass',css:'width:100%;',onClick:()=>{
      S.sellerMode=false;S.sellerScreen='auth';S._sellerRegStep=0;S._sellerForm=null;S._sellerAppId=null;
      if(S._sellerPollTimer){clearInterval(S._sellerPollTimer);S._sellerPollTimer=null;}
      render();
    }});
    b.textContent='Вернуться в магазин';ok.appendChild(b);scr.appendChild(ok);

    // Polling каждые 5 сек
    if(appId && !S._sellerPollTimer){
      S._sellerPollTimer=setInterval(async()=>{
        try{
          const r=await fetch('/api/seller',{method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'check_app',shortId:appId})});
          const d=await r.json();
          if(!d.ok)return;
          const box=document.getElementById('seller-app-status');
          if(!box)return;
          if(d.status==='approved'){
            clearInterval(S._sellerPollTimer);S._sellerPollTimer=null;
            box.style.background='rgba(48,209,88,.1)';
            box.style.border='1px solid rgba(48,209,88,.3)';
            box.innerHTML=
              '<div style="font-size:18px;font-weight:800;color:#30d158;margin-bottom:12px;"> Заявка одобрена!</div>'+
              '<div style="font-size:13px;color:var(--txt2);margin-bottom:12px;">Ваши данные для входа:</div>'+
              '<div style="background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-bottom:8px;">'+
              '<div style="font-size:12px;color:var(--txt3);margin-bottom:4px;">Логин</div>'+
              '<div style="font-size:20px;font-weight:900;font-family:monospace;color:#fff;">'+(d.login||'—')+'</div>'+
              '</div>'+
              '<div style="background:rgba(0,0,0,.3);border-radius:12px;padding:14px;">'+
              '<div style="font-size:12px;color:var(--txt3);margin-bottom:4px;">Пароль</div>'+
              '<div style="font-size:20px;font-weight:900;font-family:monospace;color:#fff;">'+(d.pass||'—')+'</div>'+
              '</div>'+
              '<div style="font-size:11px;color:var(--txt3);margin-top:10px;">Сохраните эти данные! Они также отправлены в Telegram.</div>';
            // Обновляем иконку наверху
            const ico=ok.querySelector('div');if(ico)ico.textContent='🎉';
          }else if(d.status==='rejected'){
            clearInterval(S._sellerPollTimer);S._sellerPollTimer=null;
            box.style.background='rgba(255,55,95,.1)';
            box.style.border='1px solid rgba(255,55,95,.3)';
            box.innerHTML=
              '<div style="font-size:16px;font-weight:800;color:#ff375f;margin-bottom:8px;">❌ Заявка отклонена</div>'+
              '<div style="font-size:13px;color:var(--txt2);">К сожалению, мы не можем принять вашу заявку в данный момент. Вы можете обратиться в поддержку или подать заявку повторно.</div>';
            const ico=ok.querySelector('div');if(ico)ico.textContent='😔';
          }
        }catch(e){}
      },5000);
    }
  }

  page.appendChild(scr);return page;
}

        {id:20005,date:new Date(Date.now()-3*86400000).toLocaleDateString('ru'),items:{'Пионы Playa Blanca':2},total:12400,status:'Уехал',section:'archive',sellerLogin:'demo_seller'},

  }});

function buildSellerOrders(body){
  const orders=getSellerOrders();

  // ── Шапка с кнопкой обновления ──
  const hdr=el('div',{css:'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;'});
  hdr.appendChild(el('div',{css:'font-size:20px;font-weight:800;'},['Заказы']));
  const refreshB=el('button',{css:'font-size:12px;color:var(--txt2);background:var(--input-bg);border:1px solid var(--input-border);border-radius:100px;padding:6px 12px;cursor:pointer;',
    onClick:async()=>{
      refreshB.textContent='⏳';refreshB.disabled=true;
      await loadSellerOrders();
      const b=document.getElementById('seller-tab-body');
      if(b){b.innerHTML='';buildSellerOrders(b);}
    }});
  refreshB.textContent='Обновить';hdr.appendChild(refreshB);
  body.appendChild(hdr);

  // Автообновление раз в 30 сек пока вкладка открыта
  if(!S._sellerOrdersPollTimer){
    S._sellerOrdersPollTimer=setInterval(async()=>{
      if(!S.sellerUser||S.sellerTab!==0||!S.sellerMode){
        clearInterval(S._sellerOrdersPollTimer);S._sellerOrdersPollTimer=null;return;
      }
      await loadSellerOrders();
      const b=document.getElementById('seller-tab-body');
      if(b&&S.sellerTab===0){b.innerHTML='';buildSellerOrders(b);}
    },30000);
  }

  const newOrds=orders.filter(o=>o.section==='new');
  const activeOrds=orders.filter(o=>o.section==='active');
  const archOrds=orders.filter(o=>o.section==='archive');

  const SECTIONS=[
    {label:'Новые',color:'rgba(48,209,88,.12)',border:'rgba(48,209,88,.3)',textColor:'#30d158',orders:newOrds},
    {label:'Активные',color:'rgba(255,214,10,.08)',border:'rgba(255,214,10,.3)',textColor:'#ffd60a',orders:activeOrds},
    {label:'Архив',color:'rgba(255,255,255,.04)',border:'rgba(255,255,255,.12)',textColor:'var(--txt3)',orders:archOrds},
  ];

  SECTIONS.forEach(sec=>{
    const wrap=el('div',{css:'margin-bottom:20px;'});
    const hdr=el('div',{css:'font-size:13px;font-weight:800;color:'+sec.textColor+';margin-bottom:10px;padding:8px 12px;background:'+sec.color+';border-radius:12px;border:1px solid '+sec.border+';'});
    hdr.textContent=sec.label+' ('+sec.orders.length+')';
    wrap.appendChild(hdr);

    if(!sec.orders.length){
      const empty=el('div',{css:'text-align:center;padding:20px;color:var(--txt3);font-size:13px;'});
      empty.textContent='Пусто';wrap.appendChild(empty);
    }

    sec.orders.forEach(order=>{
      const card=el('div',{css:'background:var(--bg2);border:1px solid var(--border);border-radius:18px;margin-bottom:10px;overflow:hidden;'});
      // Заголовок заказа
      const cardHdr=el('div',{css:'display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;',
        onClick:()=>{order._open=!order._open;render();}});
      const idEl=el('div',{css:'font-size:14px;font-weight:800;'}); idEl.textContent='ЗАКАЗ №'+order.id;
      cardHdr.appendChild(idEl);
      const right=el('div',{css:'display:flex;align-items:center;gap:8px;'});
      if(order.status&&sec.label.includes('Активные')){
        const stBadge=el('div',{css:'font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:rgba(255,214,10,.15);color:#ffd60a;border:1px solid rgba(255,214,10,.3);'});
        stBadge.textContent=order.status;right.appendChild(stBadge);
      }
      right.appendChild(el('div',{css:'color:var(--txt3);font-size:18px;transition:transform .2s;transform:'+(order._open?'rotate(90deg)':'rotate(0deg)')+';'},['›']));
      cardHdr.appendChild(right);card.appendChild(cardHdr);

      // Раскрытое содержимое
      if(order._open){
        const detail=el('div',{css:'padding:0 16px 16px;border-top:0.5px solid var(--border);'});
        detail.appendChild(el('div',{css:'font-size:11px;color:var(--txt3);margin:10px 0 8px;'},['Состав заказа:']));
        Object.entries(order.items).forEach(([name,qty])=>{
          const r=el('div',{css:'display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:0.5px solid rgba(255,255,255,.05);'});
          r.appendChild(el('span',{},[name]));
          r.appendChild(el('span',{css:'color:var(--txt2);'},['× '+qty]));
          detail.appendChild(r);
        });
        detail.appendChild(el('div',{css:'font-size:15px;font-weight:800;color:var(--accent);margin-top:12px;margin-bottom:12px;'},['Итого: '+order.total.toLocaleString('ru')+' ₽']));

        // Кнопки действий
        const actionMap={
          new:     {text:'Принять заказ', next:'active', status:'Новый', section:'active'},
          active_Новый:     {text:'Начать сборку',  next:'active', status:'Сборка'},
          active_Сборка:    {text:'Заказ собран',    next:'active', status:'Ждём курьера'},
          'active_Ждём курьера':{text:'Заказ отправлен',next:'active',status:'Уехал'},
          active_Уехал:     {text:'Завершить',      next:'archive', section:'archive', status:null},
        };
        const key=sec.label.includes('Новые')?'new':('active_'+(order.status||''));
        const act=actionMap[key];
        if(act){
          const btn=el('button',{cls:'btn-prim',css:'width:100%;',onClick:()=>{
            if(act.section)order.section=act.section;
            if(act.status!==undefined)order.status=act.status;
            order._open=false;
            syncSellerOrderStatus(order);
            render();
          }});
          btn.textContent=act.text;detail.appendChild(btn);
        }
        card.appendChild(detail);
      }
      wrap.appendChild(card);
    });
    body.appendChild(wrap);
  });
}

// 2) Восстанавливаем незавершённый checkout из localStorage
(function restoreCheckout(){
  if(S.checkout)return; // уже установлен из URL
  try{
    const saved=loadCheckout();
    if(!saved||!saved.orderId)return;
    // Проверяем что заказ ещё не завершён
    const order=S.orders.find(o=>String(o.id)===String(saved.orderId));
    if(!order)return;
    if(['Завершён','Отменён','ЗАКРЫТ','ОТМЕНЁН'].includes(order.status)){clearCheckout();return;}
    // Если шаг 4 или 5 — проверяем localStorage state на случай если реквизиты пришли пока не было сети
    if(saved.step===4){
      const ordState=getLocalOrderState(saved.orderId);
      if(ordState&&ordState.payState==='requisites_sent'){
        saved.step=5;
        saved.payBank=BANKS.find(b=>b.id===ordState.payBankId)||BANKS.find(b=>b.name===ordState.payBank)||BANKS[0];
        saved.payPhone=ordState.payPhone||'—';
        saved.payName=ordState.payName||'—';
        saved._paidEnabled=true;
      }
    }
    // НЕ восстанавливаем автоматически — только показываем диалог через таблетку
    // S.checkout = saved; // не делаем — пользователь сам решит через таблетку
  }catch(e){}
})();

// Загружаем каталог с сервера (чтобы все видели одинаковый)
(async function loadCatalog(){
  async function fetchCatalog(){
    try{
      const r=await fetch('/api/catalog',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'get'})});
      const d=await r.json();
      let changed=false;
      if(d.flowers&&d.flowers.length&&JSON.stringify(d.flowers)!==JSON.stringify(FLOWERS)){
        FLOWERS=d.flowers;changed=true;
      }
      if(d.gifts&&d.gifts.length&&JSON.stringify(d.gifts)!==JSON.stringify(GIFTS)){
        GIFTS=d.gifts;changed=true;
      }
      if(d.carousel&&d.carousel.length&&JSON.stringify(d.carousel)!==JSON.stringify(CAROUSEL_SLIDES)){
        CAROUSEL_SLIDES=d.carousel;changed=true;
      }

      // Подгружаем изображения из KV для товаров у которых есть imgKey или imgUrl='__kv__'const allItems=[...FLOWERS,...GIFTS];
      const keysToFetch=[...new Set(
        allItems
          .filter(p=>p.imgKey||(p.imgUrl==='__kv__'))
          .map(p=>p.imgKey||('img:'+String(p.id)))
      )];
      if(keysToFetch.length){
        try{
          const ir=await fetch('/api/images',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'get_batch',keys:keysToFetch})});
          const id=await ir.json();
          if(id.ok&&id.images){
            allItems.forEach(p=>{
              const k=p.imgKey||('img:'+String(p.id));
              if(id.images[k]){p.imgUrl=id.images[k];changed=true;}
            });
          }
        }catch(e){}
      }

      if(changed&&!S.checkout&&!S.onboard){
        const body=document.getElementById('main-content');
        if(body){body.innerHTML='';buildMainContent(body);}
        else render();
      }
    }catch(e){}
  }
  await fetchCatalog();
  setInterval(fetchCatalog, 30000);
})();

// ── Загрузочный экран — показываем 3 сек только при первом визите ──
(function(){
  const splash=document.getElementById('splash');
  if(!splash)return;
  // Если уже был визит — убираем быстро
  const seen=sessionStorage.getItem('vn_seen');
  const delay=seen?300:3000;
  if(seen)splash.style.animation='none';
  setTimeout(()=>{splash.classList.add('fade-out');setTimeout(()=>{splash.remove();},650);},delay);
  sessionStorage.setItem('vn_seen','1');
})();

// ── Переключение между мобильной и десктопной раскладкой по ширине окна ──
(function(){
  let lastIsDesktop = S.isDesktop;
  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const nowDesktop = computeIsDesktop();
      S.isDesktop = nowDesktop;
      if(nowDesktop !== lastIsDesktop){ lastIsDesktop = nowDesktop; render(); }
    }, 150);
  });
})();

render();
