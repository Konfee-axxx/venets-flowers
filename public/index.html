<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06261d">
<title>Venets Flowers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
:root{
  --bg:#06261d;--bg2:#0a3226;--bg3:#0f4032;
  --glass:rgba(255,255,255,0.07);--glass2:rgba(255,255,255,0.12);
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);
  --txt:#f0f0ff;--txt2:#8090a0;--txt3:#405048;
  --green:#30d158;--blue:#0a84ff;--pink:#ff375f;--gold:#ffd60a;
  --accent:#ee9e23;--safe-b:env(safe-area-inset-bottom,0px);
  --blur:blur(40px) saturate(180%);
  --nav-bg:rgba(6,38,29,.85);
  --card-shadow:0 2px 12px rgba(0,0,0,.35);
  --input-bg:rgba(255,255,255,.06);
  --input-border:rgba(255,255,255,.12);
  --sheet-bg:#0f4032;
  --dropdown-bg:#123a2d;
}
/* Светлая тема */
html.light{
  --bg:#e1f4ee;--bg2:#ffffff;--bg3:#ffffff;
  --glass:rgba(255,255,255,0.7);--glass2:rgba(255,255,255,0.9);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.18);
  --txt:#090910;--txt2:#6060aa;--txt3:#a0a0c0;
  --accent:#ee9e23;
  --nav-bg:rgba(225,244,238,.95);
  --card-shadow:0 2px 12px rgba(0,0,0,.08);
  --input-bg:rgba(0,0,0,.05);
  --input-border:rgba(0,0,0,.12);
  --sheet-bg:#ffffff;
  --dropdown-bg:#ffffff;
}
/* Плавный переход при смене темы */
html{transition:background .35s ease,color .35s ease;}
*{transition:background-color .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;overflow:hidden;touch-action:pan-y;}

/* Переключатель темы */
.theme-toggle{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  z-index:1000;
  width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;padding:3px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
html.light .theme-toggle{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.15);}
.theme-toggle-thumb{
  width:20px;height:20px;border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
  transform:translateX(0);
  transition:transform .3s cubic-bezier(.34,1.2,.64,1);
}
html.light .theme-toggle-thumb{transform:translateX(18px);background:#fff;}
::-webkit-scrollbar{width:0;height:0;}

/* ═══ LIQUID GLASS ═══ */
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.04) 100%);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.2),inset 0 -1px 0 rgba(0,0,0,0.15),0 8px 32px rgba(0,0,0,0.4);
}
.btn-glass{
  width:100%;padding:17px;border-radius:20px;border:none;
  font-size:17px;font-weight:700;cursor:pointer;color:#4ab5ff;
  background:linear-gradient(135deg,rgba(10,132,255,0.2),rgba(10,132,255,0.08));
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(10,132,255,0.35);
  box-shadow:inset 0 1px 0 rgba(10,132,255,0.3),inset 0 -1px 0 rgba(0,0,0,0.2),0 4px 20px rgba(10,132,255,0.2);
  transition:all .2s;
}
.btn-glass:active{transform:scale(.97);opacity:.85;}
.btn-prim{
  width:100%;padding:17px;border-radius:20px;border:none;
  font-size:17px;font-weight:700;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,rgba(238,158,35,0.9),rgba(255,55,95,0.85));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),inset 0 -1px 0 rgba(0,0,0,0.2),0 8px 30px rgba(238,158,35,0.4);
  transition:all .2s;
}
.btn-prim:active{transform:scale(.97);}
.btn-prim:disabled,.btn-prim[disabled]{opacity:.4;pointer-events:none;}

/* ═══ ГРАДИЕНТ ═══ */
@keyframes gradFlow{0%{background-position:0%}100%{background-position:400%}}
/* градиент имени 24 сек */
.grad-text{animation:gradFlow 24s linear infinite!important;}
.grad-text{
  background:linear-gradient(90deg,#ee9e23,#ffd60a,#30d158,#ff375f,#0a84ff,#ee9e23);
  background-size:400%;animation:gradFlow 14s linear infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.grad-border{
  border:1.5px solid transparent!important;
  background:linear-gradient(var(--bg3),var(--bg3)) padding-box,
    linear-gradient(90deg,#ee9e23,#ffd60a,#30d158,#ff375f,#0a84ff,#ee9e23) border-box;
  background-size:auto,400%;animation:gradFlow 14s linear infinite;
}

/* ═══ АНИМАЦИИ ═══ */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fdIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(-20%);opacity:0}}
@keyframes spin360{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ═══ LAYOUT ═══ */
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

/* ═══ НАВ ═══ */
.nav{
  background:rgba(0,0,8,0.88);
  backdrop-filter:blur(50px) saturate(200%);-webkit-backdrop-filter:blur(50px) saturate(200%);
  border-top:0.5px solid rgba(255,255,255,0.1);
  padding:8px 0 calc(10px + var(--safe-b));
  display:flex;position:relative;z-index:100;
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;border:none;background:none;position:relative;z-index:1;}
.nav-icon{font-size:22px;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.nav-label{font-size:10px;font-weight:600;color:var(--txt3);transition:color .25s;letter-spacing:.2px;}
.nav-btn.active .nav-label{color:var(--accent);}
.nav-pill{
  position:absolute;top:6px;height:calc(100% - 12px - var(--safe-b));
  border-radius:16px;
  background:linear-gradient(135deg,rgba(238,158,35,.22),rgba(238,158,35,.10));
  border:1px solid rgba(238,158,35,.4);
  box-shadow:0 4px 16px rgba(238,158,35,.28),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),width .45s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:0;
}
.nav-btn.active .nav-icon{transform:scale(1.25);}

/* ═══ ШАПКА ═══ */
.hdr{
  padding:14px 16px 12px;display:flex;align-items:center;gap:10px;
  background:var(--nav-bg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:50;
}
.hdr-title{font-size:24px;font-weight:700;flex:1;}

/* ═══ ФИЛЬТР-БАР ═══ */
.fbar{display:flex;gap:8px;padding:10px 14px 6px;overflow-x:auto;}
.fpill{
  display:flex;align-items:center;gap:5px;
  padding:8px 16px;border-radius:100px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  background:linear-gradient(135deg,rgba(255,255,255,0.09),rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.15);color:var(--txt2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 2px 8px rgba(0,0,0,0.3);
  transition:all .25s;flex-shrink:0;
}
.fpill.on{border-color:var(--accent);color:var(--accent);background:rgba(238,158,35,.15);box-shadow:0 0 12px rgba(238,158,35,.2);}

/* ═══ СЕТКА ═══ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px 120px;}
/* Все карточки строго одинаковой высоты через grid-auto-rows */

/* ═══ КАРУСЕЛЬ ═══ */
/* Высота = половина ширины карточки = (100vw - 24px padding - 10px gap) / 4 */
.carousel-wrap{position:relative;width:100%;height:calc((100vw - 34px) / 4);overflow:hidden;border-radius:18px;margin:8px 12px 10px;width:calc(100% - 24px);}
.carousel-track{display:flex;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform;}
.carousel-slide{min-width:100%;height:100%;display:flex;align-items:center;padding:0 18px;position:relative;overflow:hidden;border-radius:18px;}
.carousel-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:18px;}
.carousel-slide-content{position:relative;z-index:1;}
.carousel-emoji{font-size:28px;margin-bottom:2px;}
.carousel-title{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);line-height:1.2;}
.carousel-sub{font-size:11px;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.5);margin-top:2px;}
.carousel-dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.carousel-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s;}
.carousel-dot.active{width:16px;border-radius:3px;background:#fff;}

/* ═══ ПОИСК ═══ */
.search-wrap{padding:8px 12px 4px;position:relative;}
.search-inp-row{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:14px;padding:10px 14px;}
.search-inp{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px;font-family:inherit;}
.search-inp::placeholder{color:var(--txt3);}
.search-dropdown{position:absolute;left:12px;right:12px;top:calc(100% - 4px);background:var(--dropdown-bg);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.search-item{padding:11px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--border);}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:rgba(255,255,255,.06);}
.search-clear{background:none;border:none;color:var(--txt3);font-size:16px;cursor:pointer;padding:2px 4px;}

/* ═══ КАРТОЧКА ═══ */
.card{
  background:var(--bg2);
  border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden;
  cursor:pointer;transition:transform .18s cubic-bezier(.34,1.2,.64,1);
  box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;
  /* Фиксированная высота тела карточки чтобы все были одинаковые */
}
.card:active{transform:scale(.95);}
.card-img{
  width:100%;aspect-ratio:1;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:56px;position:relative;overflow:hidden;flex-shrink:0;
}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;}
.card-tags{position:absolute;top:6px;left:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:calc(100% - 8px);}
/* Цветные теги — разные цвета с белым текстом и тёмной обводкой */
.tag{font-size:9px;font-weight:800;padding:3px 7px;border-radius:100px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  letter-spacing:.3px;line-height:1.3;border:1.5px solid rgba(0,0,0,.5);}
.tag-pink{background:rgba(255,45,85,.7);}
.tag-purple{background:rgba(238,158,35,.75);}
.tag-blue{background:rgba(10,132,255,.7);}
.tag-green{background:rgba(48,209,88,.65);}
.tag-gold{background:rgba(255,159,10,.7);}
.tag-dark{background:rgba(0,0,0,.6);}
/* Тело карточки — строго фиксированная высота 96px чтобы все одинаковые */
.card-body{padding:7px 9px 8px;display:flex;flex-direction:column;height:96px;box-sizing:border-box;overflow:hidden;}
.card-name{font-size:11.5px;font-weight:700;color:var(--txt);margin-bottom:2px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0;}
.card-shop{font-size:9.5px;color:var(--accent);font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.card-stars{font-size:9px;color:#ffd60a;margin-bottom:0;display:flex;align-items:center;gap:2px;flex-shrink:0;}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:auto;}
.card-price{font-size:13px;font-weight:800;color:var(--txt);}
.add-btn{
  background:var(--accent);color:#fff;border:none;
  border-radius:100px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;
  box-shadow:0 2px 8px rgba(238,158,35,.4);
  transition:transform .15s;flex-shrink:0;white-space:nowrap;
}
.add-btn:active{transform:scale(.88);}
.qty-pill{display:flex;align-items:center;gap:6px;background:var(--accent);border-radius:100px;padding:5px 9px;flex-shrink:0;box-shadow:0 2px 8px rgba(238,158,35,.4);}
.qty-btn{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;font-weight:800;line-height:1;padding:0 1px;}
.qty-n{color:#fff;font-size:12px;font-weight:800;min-width:14px;text-align:center;}
.qty-n{font-size:12px;font-weight:700;color:#fff;}

/* ═══ FAB ═══ */
.fab{
  position:fixed;bottom:calc(82px + var(--safe-b));right:16px;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#ff375f);
  border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:24px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 32px rgba(238,158,35,.55);
  display:flex;align-items:center;justify-content:center;z-index:200;transition:transform .2s;
}
.fab:active{transform:scale(.88);}
.fab-badge{position:absolute;top:-3px;right:-3px;background:#ff375f;color:#fff;border-radius:50%;min-width:20px;height:20px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}

/* ═══ ОВЕРЛЕЙ / ШТОРКА ═══ */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-end;}
.overlay.fade-in{animation:fdIn .25s ease;}
.overlay.fade-out{animation:fdIn .35s ease reverse;}
.sheet{
  width:100%;max-height:90vh;overflow-y:auto;
  background:rgba(10,10,22,.96);backdrop-filter:blur(60px);-webkit-backdrop-filter:blur(60px);
  border-radius:28px 28px 0 0;border-top:0.5px solid rgba(255,255,255,0.15);
  border-left:0.5px solid rgba(255,255,255,0.08);border-right:0.5px solid rgba(255,255,255,0.08);
  padding:0 0 calc(24px + var(--safe-b));
  box-shadow:0 -20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.12);
}
.sheet.slide-up{animation:slideUp .4s cubic-bezier(.32,.72,0,1);}
.sheet.slide-down{animation:slideUp .5s cubic-bezier(.32,.72,0,1) reverse;}
.drag{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:12px auto 20px;}
.sheet-title{font-size:20px;font-weight:700;padding:0 18px 14px;}

/* ═══ ИНПУТЫ ═══ */
.inp{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;padding:14px 16px;font-size:16px;color:var(--txt);
  width:100%;outline:none;transition:border-color .25s,box-shadow .25s;
  -webkit-appearance:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2);
}
.inp:focus{border-color:var(--accent);box-shadow:inset 0 1px 3px rgba(0,0,0,.2),0 0 0 3px rgba(238,158,35,.2);}
.inp::placeholder{color:var(--txt3);}
.inp.valid{border-color:var(--green);box-shadow:inset 0 1px 3px rgba(0,0,0,.2),0 0 0 3px rgba(48,209,88,.15);}
.inp-label{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px;letter-spacing:.3px;}

/* ═══ OTP ═══ */
.phone-row{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;}
.phone-prefix{font-size:14px;font-weight:800;color:var(--txt2);flex-shrink:0;margin-right:1px;}
.phone-sep{font-size:14px;font-weight:700;color:var(--txt3);flex-shrink:0;}
.otp-box{
  width:24px;height:32px;border-radius:7px;
  border:1.5px solid rgba(255,255,255,0.15);
  background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
  font-size:13px;font-weight:700;text-align:center;color:var(--txt);
  outline:none;transition:border-color .2s;-webkit-appearance:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
}
.otp-box:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(238,158,35,.2);}
.otp-box.ok{border-color:var(--green);color:var(--green);}

/* ═══ СПИСОК ═══ */
.list-sec{
  background:linear-gradient(135deg,rgba(255,255,255,0.07),rgba(255,255,255,0.03));
  border:1px solid rgba(255,255,255,0.1);border-radius:22px;margin:0 14px 12px;overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 4px 20px rgba(0,0,0,.25);
}
.list-row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:0.5px solid rgba(255,255,255,0.06);cursor:pointer;transition:background .15s;}
.list-row:last-child{border-bottom:none;}
.list-row:active{background:rgba(255,255,255,.05);}
.list-row.dis{opacity:.3;pointer-events:none;}
.list-ic{font-size:20px;width:24px;text-align:center;}
.list-lbl{flex:1;font-size:15px;font-weight:500;}
.list-arr{color:var(--txt3);font-size:18px;}

/* ═══ ТОГГЛ ═══ */
.tog{width:44px;height:26px;border-radius:13px;background:var(--bg3);position:relative;cursor:pointer;border:none;transition:background .22s;flex-shrink:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
.tog.on{background:var(--green);}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#fff,#e0e0e0);transition:transform .22s;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.tog.on::after{transform:translateX(18px);}

/* ═══ FAQ ═══ */
.faq-item{border-bottom:0.5px solid rgba(255,255,255,0.06);}
.faq-q{width:100%;text-align:left;padding:16px 18px;background:none;border:none;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.faq-arr{color:var(--txt3);transition:transform .35s cubic-bezier(.34,1.2,.64,1);display:inline-block;}
.faq-arr.open{transform:rotate(90deg);}
.faq-body{overflow:hidden;max-height:0;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.faq-body.open{max-height:200px;}
.faq-txt{padding:0 18px 16px;color:var(--txt2);font-size:14px;line-height:1.7;}

/* ═══ ДЕТАЛЬНАЯ ═══ */
.detail-page{position:fixed;inset:0;z-index:400;background:var(--bg);overflow-y:auto;animation:slideIn .3s cubic-bezier(.32,.72,0,1);}
.detail-img{aspect-ratio:1;background:linear-gradient(145deg,var(--bg3),var(--bg2));display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;}
.detail-img::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.05),transparent);}
.detail-back{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 16px rgba(0,0,0,.5);z-index:410;}
.detail-foot{position:sticky;bottom:0;background:var(--nav-bg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-top:0.5px solid var(--border);padding:14px 18px calc(14px + var(--safe-b));display:flex;align-items:center;gap:14px;}

/* ═══ ОНБОРДИНГ ═══ */
.onboard{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 72px) 20px 40px;animation:fdIn .3s ease;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ob-emoji{font-size:58px;margin-bottom:16px;animation:float 3s ease-in-out infinite;}
.ob-title{font-size:26px;font-weight:800;text-align:center;line-height:1.25;margin-bottom:10px;}
.ob-sub{font-size:14px;color:var(--txt2);text-align:center;line-height:1.65;margin-bottom:24px;}

/* ═══ УВЕДОМЛЕНИЕ ═══ */
.notif-bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,35,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 20px;font-size:14px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 40px rgba(0,0,0,.6);animation:slideIn .3s cubic-bezier(.34,1.56,.64,1);}

/* ═══ ПОЛЗУНОК ═══ */
.range-wrap{position:relative;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:20px 0 8px;}
.range-fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--accent),#ff375f);border-radius:2px;}
input[type=range]{position:absolute;top:50%;transform:translateY(-50%);width:100%;-webkit-appearance:none;background:transparent;pointer-events:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#fff,#e0e0e0);border:2px solid var(--bg);cursor:pointer;pointer-events:all;box-shadow:0 2px 8px rgba(0,0,0,.5);}

/* ═══ БАННЕР ЗАКАЗА ═══ */
.order-bar{background:rgba(10,10,22,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-top:0.5px solid rgba(255,255,255,.1);padding:10px 14px calc(10px + var(--safe-b));display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;z-index:90;box-shadow:0 -4px 20px rgba(0,0,0,.3);}

/* ═══ ЧЕКАУТ ═══ */
.co-page{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;animation:slideIn .3s cubic-bezier(.32,.72,0,1);}
.back-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--accent);font-size:16px;font-weight:600;cursor:pointer;padding:0;}

/* ═══ ЧАТ ═══ */
.chat-page{position:fixed;inset:0;z-index:450;background:var(--bg);display:flex;flex-direction:column;animation:slideIn .3s cubic-bezier(.32,.72,0,1);}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;margin:3px 0;}
.msg-out{background:linear-gradient(135deg,var(--accent),rgba(238,158,35,.7));color:#fff;align-self:flex-end;border-bottom-right-radius:6px;box-shadow:0 2px 10px rgba(238,158,35,.3);}
.msg-in{background:rgba(255,255,255,.08);color:var(--txt);align-self:flex-start;border-bottom-left-radius:6px;}

/* ═══ СЛАЙДЕР ВКЛАДОК ═══ */
.tab-slider{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;}
.tab-track{display:flex;flex:1;transition:transform .38s cubic-bezier(.4,0,.2,1);will-change:transform;}
.tab-slide{width:100%;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;}
/* ═══ ПЛАВАЮЩАЯ ТАБЛЕТКА ЗАКАЗА ═══ */
.order-fab{position:fixed;bottom:calc(86px + var(--safe-b));left:16px;border-radius:100px;padding:8px 14px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1.5px solid;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);white-space:nowrap;max-width:calc(100vw - 90px);overflow:hidden;background:rgba(10,10,22,.92);}
.spinner{width:52px;height:52px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin360 .9s linear infinite;}

/* ═══ СТАТУС ТАБЛЕТКА ═══ */
.status-pill{display:inline-block;padding:3px 12px;border-radius:100px;font-size:11px;font-weight:700;}

/* ═══ АДРЕС КАРТОЧКА ═══ */
.addr-card{background:var(--input-bg);border:1.5px solid var(--border2);border-radius:18px;margin-bottom:8px;overflow:hidden;transition:border-color .2s;}
.addr-card.sel{border-color:var(--accent);background:rgba(238,158,35,.08);}
.addr-head{display:flex;align-items:center;padding:14px 16px;cursor:pointer;}

/* ═══ ADMIN ═══ */
.admin-page{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;}
/* ─── Светлая тема: точечные переопределения ─── */
html.light #splash{background:#0f6e56;}
html.light #splash .splash-sub{color:rgba(255,255,255,.55);}
html.light .notif-bar{background:rgba(9,9,16,.9);color:#fff;}

/* Шапка — светлая поверхность на зелёном фоне */
html.light .hdr{background:rgba(238,248,244,.97)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:1px solid rgba(0,0,0,.1)!important;box-shadow:0 1px 8px rgba(0,0,0,.06);}
html.light .hdr-title{color:#090910;}

/* Навбар */
html.light .nav{background:rgba(238,248,244,.97)!important;border-top:1px solid rgba(0,0,0,.1)!important;}
html.light .nav-btn .nav-icon{color:rgba(0,0,0,.35);}
html.light .nav-label{color:rgba(0,0,0,.35);}
html.light .nav-btn.active .nav-icon,html.light .nav-btn.active .nav-label{color:var(--accent);}

/* Карточки */
html.light .card{background:#ffffff!important;border-color:rgba(0,0,0,.08)!important;box-shadow:0 2px 14px rgba(0,0,0,.07);}
html.light .card-img{background:linear-gradient(145deg,#e4f2ec,#d9ebe2)!important;}
html.light .card-name{color:#090910;}
html.light .card-price{color:#090910;}

/* Слоты времени доставки — чёткие грани */
html.light [data-slot-id]{
  background:#ffffff!important;
  border-color:rgba(0,0,0,.18)!important;
  color:#090910!important;
}

/* Инпуты */
html.light .inp{background:rgba(0,0,0,.04)!important;border-color:rgba(0,0,0,.14)!important;color:#090910!important;}
html.light .inp::placeholder{color:rgba(0,0,0,.35)!important;}
html.light .inp:focus{border-color:var(--accent)!important;}

/* Поиск */
html.light .search-inp-row{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);}
html.light .search-inp{color:#090910;}
html.light .search-dropdown{background:#ffffff;border-color:rgba(0,0,0,.1);box-shadow:0 8px 32px rgba(0,0,0,.12);}
html.light .search-item{border-bottom-color:rgba(0,0,0,.06);}

/* Фильтры */
html.light .fbar{background:transparent;}
html.light .fpill{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#090910;}
html.light .fpill.on{background:rgba(238,158,35,.14);border-color:var(--accent);color:var(--accent);}

/* Кнопки */
html.light .btn-glass{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:#090910;}
html.light .btn-glass:active{background:rgba(0,0,0,.1);}

/* Листы и оверлеи */
html.light .sheet{background:#ffffff!important;}
html.light .drag{background:rgba(0,0,0,.15);}
html.light .overlay{background:rgba(0,0,0,.35);}
html.light .sheet-title{color:#090910;}

/* Списки */
html.light .list-sec{background:#ffffff;border-color:rgba(0,0,0,.07);}
html.light .list-row{border-bottom-color:rgba(0,0,0,.06);}
html.light .list-row:active{background:rgba(0,0,0,.03);}

/* Теги */
html.light .tag{border-color:rgba(0,0,0,.25);}

/* Checkout */
html.light .co-page{background:var(--bg);}
html.light .co-page .hdr{background:rgba(238,248,244,.97)!important;}

/* ═══ ЗАГРУЗОЧНЫЙ ЭКРАН ═══ */
#splash{position:fixed;inset:0;z-index:9999;background:#090910;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease;}
#splash.fade-out{opacity:0;pointer-events:none;}
.splash-logo{width:120px;height:auto;animation:splashPulse 1s ease-in-out infinite alternate;filter:drop-shadow(0 4px 20px rgba(0,0,0,.35));}
.splash-sub{font-size:14px;color:rgba(255,255,255,.4);margin-top:18px;letter-spacing:2px;text-transform:uppercase;}
.splash-bar{width:120px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:32px;overflow:hidden;}
.splash-progress{height:100%;width:0%;background:linear-gradient(90deg,#ee9e23,#ff375f);border-radius:3px;animation:splashLoad 2.8s ease forwards;}
@keyframes splashPulse{from{transform:scale(1);}to{transform:scale(1.08);}}
@keyframes splashLoad{0%{width:0%;}60%{width:75%;}90%{width:92%;}100%{width:100%;}}
/* ══════════════════════════════════════════════════════════════
   ДЕСКТОП — широкие экраны (≥1024px)
   ══════════════════════════════════════════════════════════════ */
.dsk-root{min-height:100%;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;}

/* — Шапка — */
.dsk-header{position:sticky;top:0;z-index:200;background:var(--bg2);border-bottom:1px solid var(--border);}
.dsk-header-inner{max-width:1280px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:28px;}
.dsk-logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
.dsk-logo-wrap img{width:34px;height:auto;}
.dsk-logo-text{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--txt);}
.dsk-fee-pill{background:rgba(238,158,35,.14);color:var(--accent);font-size:11px;font-weight:800;padding:4px 10px;border-radius:100px;white-space:nowrap;}
.dsk-search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:100px;padding:11px 18px;position:relative;}
.dsk-search input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--txt);font-family:inherit;}
.dsk-search input::placeholder{color:var(--txt3);}
.dsk-nav-links{display:flex;align-items:center;gap:24px;margin-left:auto;flex-shrink:0;}
.dsk-nav-link{font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;white-space:nowrap;transition:color .15s;}
.dsk-nav-link:hover{color:var(--txt);}
.dsk-nav-link.active{color:var(--accent);}
.dsk-icon-btn{width:42px;height:42px;border-radius:50%;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;font-size:16px;font-weight:700;color:var(--txt);transition:transform .15s;}
.dsk-icon-btn:active{transform:scale(.92);}
.dsk-icon-btn.dsk-cart-btn{background:var(--bg);color:#fff;}
.dsk-icon-badge{position:absolute;top:-2px;right:-2px;background:var(--pink);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg2);}

/* — Тело каталога — */
.dsk-body{max-width:1280px;width:100%;margin:0 auto;padding:28px 32px 80px;}

/* — Hero — */
.dsk-hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:36px;}
.dsk-hero-main{background:linear-gradient(145deg,var(--bg),#0a3428);border-radius:28px;padding:40px 40px 32px;color:#fff;display:flex;flex-direction:column;justify-content:center;min-height:320px;position:relative;overflow:hidden;}
.dsk-hero-badge{display:inline-flex;align-items:center;background:rgba(238,158,35,.2);border:1px solid rgba(238,158,35,.4);color:#ffc670;font-size:12px;font-weight:800;padding:6px 14px;border-radius:100px;width:fit-content;margin-bottom:20px;}
.dsk-hero-title{font-size:40px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-bottom:14px;}
.dsk-hero-sub{font-size:14px;color:rgba(255,255,255,.65);line-height:1.6;max-width:340px;margin-bottom:24px;}
.dsk-hero-dots{display:flex;gap:6px;}
.dsk-hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s;}
.dsk-hero-dot.active{width:20px;border-radius:3px;background:#fff;}
.dsk-hero-side{display:grid;grid-template-rows:1fr 1fr;gap:20px;}
.dsk-hero-tile{border-radius:24px;overflow:hidden;position:relative;background:var(--bg3);min-height:100px;cursor:pointer;}
.dsk-hero-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.dsk-hero-tile-lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.dsk-hero-tile-label{position:absolute;left:16px;bottom:14px;color:#fff;font-weight:800;font-size:14px;text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:1;}
.dsk-hero-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);}

/* — Секционный заголовок — */
.dsk-sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;}
.dsk-sec-title{font-size:24px;font-weight:800;letter-spacing:-.01em;}
.dsk-sec-sub{font-size:13px;color:var(--txt2);margin-top:4px;}
.dsk-sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);}
.dsk-sort select{border:1px solid var(--border2);background:var(--bg2);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}

/* — Layout: сайдбар + сетка — */
.dsk-layout{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start;}

/* — Сайдбар фильтров — */
.dsk-sidebar{position:sticky;top:96px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:22px;}
.dsk-sidebar-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:20px;}
.dsk-filter-group{margin-bottom:22px;}
.dsk-filter-label{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.dsk-check-row{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;font-size:13px;color:var(--txt);}
.dsk-checkbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s;}
.dsk-checkbox.on{background:var(--accent);border-color:var(--accent);}
.dsk-price-vals{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:8px;font-weight:600;}
.dsk-occasion-row{display:flex;flex-wrap:wrap;gap:7px;}
.dsk-occasion-pill{padding:7px 13px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--border2);color:var(--txt2);cursor:pointer;transition:all .15s;}
.dsk-occasion-pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.dsk-toggle-row{display:flex;align-items:center;justify-content:space-between;padding-top:4px;}
.dsk-reset-link{font-size:12px;font-weight:700;color:var(--txt3);cursor:pointer;margin-top:18px;display:inline-block;}
.dsk-reset-link:hover{color:var(--pink);}

/* — Сетка карточек — */
.dsk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.dsk-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;}
.dsk-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.12);}
.dsk-card-img{aspect-ratio:1;background:var(--bg3);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;}
.dsk-card-img img{width:100%;height:100%;object-fit:cover;}
.dsk-card-badge{position:absolute;top:10px;left:10px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:100px;z-index:1;}
.dsk-card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;flex:1;}
.dsk-card-name{font-size:14px;font-weight:700;line-height:1.35;color:var(--txt);}
.dsk-card-seller{font-size:12px;color:var(--accent);font-weight:600;}
.dsk-card-rating{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:3px;margin-bottom:4px;}
.dsk-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;}
.dsk-card-price{font-size:17px;font-weight:800;color:var(--txt);}
.dsk-card-add{background:var(--bg);color:#fff;border:none;border-radius:100px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .15s;}
.dsk-card-add:active{transform:scale(.92);}
.dsk-card-qty{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:100px;padding:6px 12px;}
.dsk-card-qty button{background:none;border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;line-height:1;}
.dsk-card-qty span{color:#fff;font-size:13px;font-weight:800;min-width:14px;text-align:center;}

/* — Корзина (боковая панель) — */
.dsk-cart-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;justify-content:flex-end;}
.dsk-cart-panel{width:420px;max-width:100%;height:100%;background:var(--bg2);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);animation:dskSlideIn .3s cubic-bezier(.32,.72,0,1);}
@keyframes dskSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

/* — Профиль (боковая панель) — */
.dsk-profile-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);display:flex;justify-content:flex-end;}
.dsk-profile-panel{width:460px;max-width:100%;height:100%;background:var(--bg2);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);animation:dskSlideIn .3s cubic-bezier(.32,.72,0,1);overflow:hidden;transform:translateZ(0);}
.dsk-profile-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.dsk-profile-body{flex:1;overflow-y:auto;min-height:0;}
.dsk-cart-head{padding:22px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.dsk-cart-items{flex:1;overflow-y:auto;padding:8px 24px;}
.dsk-cart-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:0.5px solid var(--border);cursor:pointer;}
.dsk-cart-img{width:60px;height:60px;border-radius:14px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;}
.dsk-cart-img img{width:100%;height:100%;object-fit:cover;}
.dsk-cart-foot{padding:20px 24px;border-top:1px solid var(--border);}

/* — Чекаут (десктоп-оболочка) — */
.dsk-checkout-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.dsk-checkout-shell{width:520px;max-width:100%;height:min(820px,calc(100vh - 80px));background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5);position:relative;display:flex;flex-direction:column;transform:translateZ(0);}

/* — Плавающая "мобильная рамка" для второстепенных экранов (профиль/чат/детали/онбординг/админка) — */
.dsk-mobile-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.dsk-mobile-frame{width:430px;max-width:100%;height:min(880px,calc(100vh - 80px));background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5);position:relative;display:flex;flex-direction:column;transform:translateZ(0);}
.dsk-mobile-frame-close{position:absolute;top:16px;right:16px;z-index:1000;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

@media (max-width:1100px){
  .dsk-layout{grid-template-columns:200px 1fr;}
  .dsk-grid{grid-template-columns:repeat(2,1fr);}
}

/* Админка и кабинет продавца остаются "мобильными" по дизайну, но на широком
   экране получают приятное центрированное обрамление вместо растянутости во всю ширину */
@media (min-width:1024px){
  .admin-page, .seller-app-page{
    left:50%;top:40px;bottom:40px;right:auto;
    transform:translateX(-50%);
    width:460px;max-width:calc(100vw - 40px);
    border-radius:28px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.5);
    border:1px solid var(--border);
  }
  body:has(.admin-page)::before, body:has(.seller-app-page)::before{
    content:'';position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:590;
  }
}
</style>

const ORD_KEY = 'vn_ord';

function getLocalOrderState(id){
  try{
    const all=JSON.parse(localStorage.getItem(ORD_KEY)||'{}');
    return all[String(id)]||null;
  }catch(e){return null;}
}

function setLocalOrderState(id, data){
  try{
    const all=JSON.parse(localStorage.getItem(ORD_KEY)||'{}');
    all[String(id)]={...(all[String(id)]||{}), ...data, _ts:Date.now()};
    localStorage.setItem(ORD_KEY, JSON.stringify(all));
  }catch(e){}
}

// ══ STATE через Vercel KV + localStorage cache ═══════════════════
async function setOrderState(id, data){
  // 1. Сразу пишем в localStorage (мгновенно)
  setLocalOrderState(id, data);
  // 2. Пишем в KV через API (работает между устройствами)
  try{
    await fetch('/api/order-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'set_order', orderId:String(id), data})
    });
  }catch(e){}
  // 3. Если оплачено — уведомляем админа
  if(data && data.payState==='paid'){
    try{
      await fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'paid', orderId:String(id)})});
    }catch(e){}
  }
}

async function getOrderState(id){
  // 1. Сначала смотрим localStorage (мгновенно)
  const local = getLocalOrderState(id);
  // Если в localStorage уже есть актуальный ответ — возвращаем сразу
  if(local && local.payState && local.payState !== 'waiting_requisites') return local;
  // 2. Запрашиваем KV (работает между устройствами)
  try{
    const r=await fetch('/api/order-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'get_order', orderId:String(id)})
    });
    const d=await r.json();
    if(d.state && d.state.payState && d.state.payState!=='waiting_requisites'){
      // Обновляем localStorage из KV
      setLocalOrderState(id, d.state);
      return d.state;
    }
  }catch(e){}
  return local || {payState:'waiting_requisites'};
}

// Сохраняем/загружаем checkout для восстановления при вылете
const CO_KEY='vn_co';
function saveCheckout(co){
  if(!co||!co.orderId)return;
  try{
    // Сохраняем только сериализуемые поля (без таймеров)
    const safe={
      step:co.step, orderId:co.orderId, total:co.total, disc:co.disc||0, timeSlot:co.timeSlot||null,
      receiver:co.receiver, otherName:co.otherName||'', otherPhone:co.otherPhone||'',
      addrIdx:co.addrIdx||0, payStatus:co.payStatus,
      payBankId:co.payBank?.id||null, payBankName:co.payBank?.name||null,
      payPhone:co.payPhone||null, payName:co.payName||null,
      _deadline:co._deadline||null,
    };
    localStorage.setItem(CO_KEY, JSON.stringify(safe));
  }catch(e){}
}
function clearCheckout(){
  try{localStorage.removeItem(CO_KEY);}catch(e){}
}
function loadCheckout(){
  try{
    const s=localStorage.getItem(CO_KEY);
    if(!s)return null;
    const d=JSON.parse(s);
    if(!d||!d.orderId)return null;
    // Восстанавливаем объект bank из id/name
    // timeSlot уже в d
    if(d.payBankId||d.payBankName){
      d.payBank=BANKS.find(b=>b.id===d.payBankId)||BANKS.find(b=>b.name===d.payBankName)||null;
    }
    return d;
  }catch(e){return null;}
}

function el(tag,props,kids){
  const e=document.createElement(tag);
  if(props)for(const[k,v]of Object.entries(props)){
    if(k==='cls')e.className=v;
    else if(k==='css')e.style.cssText=v;
    else if(k[0]==='o'&&k[1]==='n')e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  if(kids)for(const k of kids){
    if(k==null)continue;
    e.appendChild(typeof k==='string'?document.createTextNode(k):k);
  }
  return e;
}
function txt(s){return document.createTextNode(String(s));}
function showNotif(msg,ico=''){
  clearTimeout(S._nt);S.notif={msg,ico};render();
  S._nt=setTimeout(()=>{S.notif=null;render();},2500);

  const existingToggle=document.getElementById('theme-toggle-btn');

  } else {
    if(!existingToggle){
      const tb=document.createElement('button');

      const thumb=document.createElement('div');

        document.documentElement.classList.toggle('light',S.lightTheme);
        thumb.textContent=S.lightTheme?'☀️':'🌙';
        try{localStorage.setItem('vn_theme',S.lightTheme?'light':'dark');}catch(e){}
      });

    } else {
      existingToggle.style.display='';
      const thumb=existingToggle.querySelector('.theme-toggle-thumb');
      if(thumb)thumb.textContent=S.lightTheme?'☀️':'🌙';
    }
  }
  if(S.onboard){wrap.appendChild(buildOnboard());return wrap;}
  if(S.checkout){wrap.appendChild(buildCheckout());return wrap;}
  if(S.adminLogin){wrap.appendChild(buildAdminLogin());return wrap;}
  if(S.adminMode){wrap.appendChild(buildAdmin());return wrap;}
  if(S.sellerMode){wrap.appendChild(buildSellerApp());return wrap;}
  if(S.chatOpen){wrap.appendChild(buildChatScreen());return wrap;}
  if(S.detail){wrap.appendChild(buildDetail());return wrap;}
  if(S.profSec){wrap.appendChild(buildProfSec());return wrap;}
  const scr=el('div',{cls:'screen',id:'main-content'});
  if(S.tab===0)scr.appendChild(buildFlowers());
  else if(S.tab===1)scr.appendChild(buildGifts());
  else scr.appendChild(buildProfile());
  if(S.tab<2){
    const cnt=cartCount();
    const fab=el('button',{cls:'fab',onClick:()=>{S.cartOpen=true;render();}},['🛒']);
    if(cnt>0)fab.appendChild(el('div',{cls:'fab-badge'},[txt(cnt)]));
    scr.appendChild(fab);
    // Таблетка активного заказа
    const ao=activeOrders()[0];
    if(ao){
      const ordState=getLocalOrderState(ao.id)||{};
      const isPayStep=ao.payState==='waiting_requisites'||ao.payState==='paid';
      const isOnPayPage=ordState.payState==='requisites_sent'&&!ao.payState==='confirmed';
      const savedCo=loadCheckout();
      const isIncomplete=savedCo&&savedCo.orderId===ao.id&&savedCo.step>0&&savedCo.step<7;

      // Мигающая красная таблетка если заказ на этапе оплаты
      if(isIncomplete&&(savedCo.step===5||savedCo.step===4)){
        const fab2=el('div',{cls:'order-fab',
          id:'order_fab_timer',
          css:'color:#ff375f;border-color:rgba(255,55,95,.7);animation:pulse 1.5s ease-in-out infinite;',
          onClick:()=>showResumeOrderDialog(ao,savedCo)});
        fab2.appendChild(el('span',{css:'font-weight:800;'},['Оплата №'+ao.id]));
        // Таймер если на шаге 5
        if(savedCo.step===5&&savedCo._deadline){
          const timerEl=el('span',{id:'fabTimer',css:'background:rgba(255,55,95,.2);color:#ff375f;border-radius:100px;padding:2px 8px;font-size:10px;font-weight:700;'},['...']);
          fab2.appendChild(timerEl);
          function updateFabTimer(){
            const el2=document.getElementById('fabTimer');
            if(!el2)return;
            const s=Math.max(0,Math.ceil((savedCo._deadline-Date.now())/1000));
            const m=Math.floor(s/60),sec=s%60;
            el2.textContent=m+':'+(sec<10?'0':'')+sec;
            if(s>0)setTimeout(updateFabTimer,1000);
          }
          setTimeout(updateFabTimer,0);
        }
        scr.appendChild(fab2);
      }else{
        const c=ORDER_COLORS[ao.status]||ORDER_COLORS['Заказ создан'];
        const fab2=el('div',{cls:'order-fab',css:'color:'+c[0]+';border-color:'+c[0]+'66;',
          onClick:()=>{
            if(isIncomplete){showResumeOrderDialog(ao,savedCo);}
            else{S.profSec='orders';S.tab=2;render();}
          }});
        fab2.appendChild(el('span',{},['Заказ №'+ao.id]));
        fab2.appendChild(el('span',{css:'background:'+c[1]+';color:'+c[0]+';border-radius:100px;padding:2px 8px;font-size:10px;'},[clientStatus(ao.status)]));
        scr.appendChild(fab2);
      }
    }
  }
  if(S.cartOpen)scr.appendChild(buildCart());
  if(S.filterOpen)scr.appendChild(buildFilter());
  if(S.sortOpen)scr.appendChild(buildSort());
  scr.appendChild(buildNav());
  wrap.appendChild(scr);
  return wrap;
}

  catGroup.appendChild(el('div',{cls:'dsk-filter-label'},['\u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f']));
  catList.forEach(tp=>{
    const on=isF?S.ff.types.includes(tp):S.gf.type===tp;
    const row=el('div',{cls:'dsk-check-row',onClick:()=>{
      if(isF){const i=S.ff.types.indexOf(tp);if(i>=0)S.ff.types.splice(i,1);else S.ff.types.push(tp);}
      else{S.gf.type=(S.gf.type===tp)?'':tp;}
      render();
    }});
    row.appendChild(el('div',{cls:'dsk-checkbox'+(on?' on':'')},[on?'\u2713':'']));
    row.appendChild(el('span',{},[tp]));
    catGroup.appendChild(row);
  });
  wrap.appendChild(catGroup);

  const priceGroup=el('div',{cls:'dsk-filter-group'});
  const f=isF?S.ff:S.gf;
  const maxBound=isF?8000:5000;
  priceGroup.appendChild(buildRangeSec('\u0426\u0435\u043d\u0430, \u20bd',0,maxBound,f.minP,f.maxP,(mn,mx)=>{f.minP=mn;f.maxP=mx;populateDesktopGrid(S.dskCatSec);}));
  wrap.appendChild(priceGroup);

  if(isF){
    const occGroup=el('div',{cls:'dsk-filter-group'});
    occGroup.appendChild(el('div',{cls:'dsk-filter-label'},['\u041f\u043e\u0432\u043e\u0434']));
    const occRow=el('div',{cls:'dsk-occasion-row'});
    ['\u0414\u043b\u044f \u043c\u0430\u043c\u044b','\u0422\u043e\u0439 \u0441\u0430\u043c\u043e\u0439','\u0421\u043a\u0438\u0434\u043a\u0430','\u041b\u044e\u0431\u0438\u043c\u043e\u0439'].forEach(tag=>{
      const on=S.dskOccasion===tag;
      occRow.appendChild(el('div',{cls:'dsk-occasion-pill'+(on?' on':''),onClick:()=>{S.dskOccasion=on?null:tag;render();}},[tag]));
    });
    occGroup.appendChild(occRow);
    wrap.appendChild(occGroup);
  }

  const hasAnyFilter=isF?(S.ff.types.length||S.ff.minP>0||S.ff.maxP<8000||S.dskOccasion):(S.gf.type||S.gf.minP>0||S.gf.maxP<5000);
  if(hasAnyFilter){
    const reset=el('div',{cls:'dsk-reset-link',onClick:()=>{
      if(isF){S.ff={types:[],minH:50,maxH:100,minP:0,maxP:8000};}else{S.gf={type:'',vegan:false,halal:false,noNuts:false,minP:0,maxP:5000};}
      S.dskOccasion=null;render();
    }},['\u0421\u0431\u0440\u043e\u0441\u0438\u0442\u044c \u0444\u0438\u043b\u044c\u0442\u0440\u044b']);

  }
  return wrap;

function buildDesktopCard(p,sec){
  const card=el('div',{cls:'dsk-card',onClick:()=>{S.detail={p,sec};render();}});
  const img=el('div',{cls:'dsk-card-img'});
  if(p.imgUrl){const im=document.createElement('img');im.src=p.imgUrl;im.alt='';img.appendChild(im);}
  else img.appendChild(el('span',{},[p.e||'\uD83C\uDF38']));
  if(p.sold&&p.sold>300)img.appendChild(el('div',{cls:'dsk-card-badge'},['\u0425\u0438\u0442']));
  card.appendChild(img);
  const body=el('div',{cls:'dsk-card-body'});
  body.appendChild(el('div',{cls:'dsk-card-name'},[getItemName(p)]));
  if(p.shopName)body.appendChild(el('div',{cls:'dsk-card-seller'},[p.shopName]));
  if(p.rating!=null)body.appendChild(el('div',{cls:'dsk-card-rating'},['\u2605 '+p.rating]));
  const foot=el('div',{cls:'dsk-card-foot'});
  foot.appendChild(el('div',{cls:'dsk-card-price'},[p.price.toLocaleString('ru')+' \u20bd']));
  const qty=S.cart[p.id]||0;
  if(qty===0){
    const addBtn=el('button',{cls:'dsk-card-add',onClick:(e)=>{
      e.stopPropagation();
      if(!S.user){showNotif('\u0412\u043e\u0439\u0434\u0438\u0442\u0435 \u0432 \u0430\u043a\u043a\u0430\u0443\u043d\u0442','\u26A0\uFE0F');return;}
      addCart(p.id);
      const c=addBtn.closest('.dsk-card');if(c)c.replaceWith(buildDesktopCard(p,sec));
      const cb=document.querySelector('.dsk-cart-btn');
      if(cb){cb.querySelectorAll('.dsk-icon-badge').forEach(b=>b.remove());const n=cartCount();if(n>0)cb.appendChild(el('div',{cls:'dsk-icon-badge'},[String(n)]));}
    }});
    addBtn.textContent='\u0412 \u043a\u043e\u0440\u0437\u0438\u043d\u0443';
    foot.appendChild(addBtn);
  }else{
    const qp=el('div',{cls:'dsk-card-qty'});
    const refresh=()=>{
      const c=qp.closest('.dsk-card');if(c)c.replaceWith(buildDesktopCard(p,sec));
      const cb=document.querySelector('.dsk-cart-btn');
      if(cb){cb.querySelectorAll('.dsk-icon-badge').forEach(b=>b.remove());const n=cartCount();if(n>0)cb.appendChild(el('div',{cls:'dsk-icon-badge'},[String(n)]));}
    };
    qp.appendChild(el('button',{onClick:(e)=>{e.stopPropagation();remCart(p.id);refresh();}},['\u2212']));
    qp.appendChild(el('span',{},[String(qty)]));
    qp.appendChild(el('button',{onClick:(e)=>{e.stopPropagation();addCart(p.id);refresh();}},['+']));
    foot.appendChild(qp);
  }
  body.appendChild(foot);
  card.appendChild(body);
  return card;
}

function populateDesktopGrid(sec){
  const gridEl=document.getElementById('dsk-grid');
  if(!gridEl)return;
  const q=(S.searchQuery||'').toLowerCase().trim();
  let items=sec==='f'?[...FLOWERS]:[...GIFTS];
  if(sec==='f'){
    const f=S.ff;
    if(f.types.length)items=items.filter(i=>f.types.includes(i.type));
    if(f.minP>0||f.maxP<8000)items=items.filter(i=>i.price>=f.minP&&i.price<=f.maxP);
    if(S.dskOccasion)items=items.filter(i=>(i.tags||[]).includes(S.dskOccasion));
  }else{
    const f=S.gf;
    if(f.type)items=items.filter(i=>i.type===f.type);
    if(f.minP>0||f.maxP<5000)items=items.filter(i=>i.price>=f.minP&&i.price<=f.maxP);
  }
  if(q)items=items.filter(p=>{
    const name=getItemName(p);
    return name.toLowerCase().includes(q)||(p.shopName||'').toLowerCase().includes(q)||(p.type||'').toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q));
  });
  items=sortItems(items);
  gridEl.innerHTML='';
  if(!items.length){
    gridEl.appendChild(el('div',{css:'grid-column:1/-1;text-align:center;padding:100px 20px;color:var(--txt3);'},[
      el('div',{css:'font-size:48px;margin-bottom:16px;'},['\uD83D\uDD0E']),
      el('div',{css:'font-size:18px;font-weight:700;color:var(--txt);margin-bottom:6px;'},['\u041d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\u043e']),
      el('div',{css:'font-size:14px;'},['\u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c \u0444\u0438\u043b\u044c\u0442\u0440\u044b \u0438\u043b\u0438 \u0437\u0430\u043f\u0440\u043e\u0441'])
    ]));
    return;
  }
  items.forEach(p=>gridEl.appendChild(buildDesktopCard(p,sec)));
}

let _navPillRect=null; // хранится между рендерами для плавного перелёта таблетки
function buildNav(){
  const nav=el('div',{cls:'nav'});
  const pill=el('div',{cls:'nav-pill'});
  nav.appendChild(pill);
  const btns=[];
  [['🌸','Цветы'],['🎁','Подарки'],['•••','Профиль']].forEach(([ic,lb],i)=>{
    const b=el('button',{cls:'nav-btn'+(S.tab===i?' active':''),onClick:()=>{S.tab=i;S.filterOpen=false;S.sortOpen=false;render();}});
    b.appendChild(el('div',{cls:'nav-icon'},[ic]));
    b.appendChild(el('div',{cls:'nav-label'},[lb]));
    nav.appendChild(b);
    btns.push(b);
  });
  requestAnimationFrame(()=>{
    const target=btns[S.tab];
    if(!target)return;
    const inset=6;
    const targetRect={left:target.offsetLeft+inset,width:target.offsetWidth-inset*2};
    if(_navPillRect && (_navPillRect.left!==targetRect.left || _navPillRect.width!==targetRect.width)){
      // Стартуем с прошлой позиции без анимации, затем анимированно летим в новую
      pill.style.transition='none';
      pill.style.transform='translateX('+_navPillRect.left+'px)';
      pill.style.width=_navPillRect.width+'px';
      pill.offsetHeight; // форсируем reflow
      pill.style.transition='';
      requestAnimationFrame(()=>{
        pill.style.transform='translateX('+targetRect.left+'px)';
        pill.style.width=targetRect.width+'px';
      });
    }else{
      pill.style.transition='none';
      pill.style.transform='translateX('+targetRect.left+'px)';
      pill.style.width=targetRect.width+'px';
      pill.offsetHeight;
      pill.style.transition='';
    }
    _navPillRect=targetRect;
  });
  return nav;
}

function buildCarousel(){
  const slides=CAROUSEL_SLIDES;
  if(!slides||!slides.length)return null;
  const wrap=el('div',{cls:'carousel-wrap'});
  const track=el('div',{cls:'carousel-track'});
  let cur=0,autoTimer=null;

  slides.forEach(s=>{
    const slide=el('div',{cls:'carousel-slide'});
    slide.style.background=s.bg||'#111';
    if(s.imgUrl){
      // Фото — без текста, только изображение (текст делается в фотошопе)
      const im=document.createElement('img');
      im.src=s.imgUrl;im.alt='';im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:18px;';
      slide.appendChild(im);
    } else {
      // Заглушка — градиент + эмодзи по центру
      const cnt=el('div',{css:'position:relative;z-index:1;width:100%;text-align:center;'});
      if(s.emoji)cnt.appendChild(el('div',{css:'font-size:36px;'},[s.emoji]));
      slide.appendChild(cnt);
    }
    track.appendChild(slide);
  });
  wrap.appendChild(track);

  const dots=el('div',{cls:'carousel-dots'});
  slides.forEach((_,i)=>{
    const d=el('div',{cls:'carousel-dot'+(i===0?' active':'')});
    d.addEventListener('click',()=>goTo(i));dots.appendChild(d);
  });
  wrap.appendChild(dots);

  function goTo(idx){
    cur=((idx%slides.length)+slides.length)%slides.length;
    track.style.transform='translateX(-'+cur*100+'%)';
    dots.querySelectorAll('.carousel-dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
  }
  function startAuto(){clearInterval(autoTimer);autoTimer=setInterval(()=>goTo(cur+1),3000);}
  wrap.addEventListener('touchstart',e=>{clearInterval(autoTimer);wrap._tx=e.touches[0].clientX;},{passive:true});
  wrap.addEventListener('touchend',e=>{const dx=(wrap._tx||0)-e.changedTouches[0].clientX;if(Math.abs(dx)>40)goTo(cur+(dx>0?1:-1));startAuto();},{passive:true});
  startAuto();
  return wrap;
}

function tagClass(tag){
  const map={
    'Любимой':'tag-pink','Ароматные':'tag-pink','Той самой':'tag-pink',
    'Для мамы':'tag-purple','Маме':'tag-pink','Красиво':'tag-purple','Мило':'tag-purple',
    'Высокие':'tag-blue','Крупные':'tag-blue','Мягкий':'tag-blue',
    'Короткие':'tag-dark','Скидка':'tag-gold','Vegan':'tag-green',
    'Полезно':'tag-green','Без орехов':'tag-green','Халяль':'tag-green',
    'Вкусно':'tag-gold','Сладкоежке':'tag-gold',
  };
  return map[tag]||'tag-dark';
}

function getItemName(p){
  return (p.type&&['Роза','Пионы','Хризантема','Тюльпаны','Лилии'].includes(p.type))?flName(p):p.name;
}

function buildSearch(){
  const wrap=el('div',{cls:'search-wrap'});
  const row=el('div',{cls:'search-inp-row'});
  row.appendChild(el('span',{css:'font-size:14px;color:var(--txt3);'},[txt('')]));

  const inp=document.createElement('input');
  inp.className='search-inp';
  inp.placeholder='Поиск...';
  inp.value=S.searchQuery||'';
  inp.setAttribute('autocomplete','off');

  const clearBtn=el('button',{cls:'search-clear'});
  clearBtn.textContent='✕';
  clearBtn.style.display=S.searchQuery?'block':'none';
  clearBtn.onclick=()=>{S.searchQuery='';S.searchActive=false;inp.value='';clearBtn.style.display='none';hideDropdown();refreshGrid();};

  let dropdown=null;
  function hideDropdown(){if(dropdown){dropdown.remove();dropdown=null;}}

  function showDropdown(results,query){
    hideDropdown();
    if(!query&&!S.searchHistory.length)return;
    dropdown=el('div',{cls:'search-dropdown'});
    // История — только если нет активного запроса
    if(!query&&S.searchHistory.length){
      dropdown.appendChild(el('div',{css:'font-size:10px;font-weight:700;color:var(--txt3);padding:8px 16px 4px;letter-spacing:.5px;'},['ИСТОРИЯ']));
      S.searchHistory.slice(0,3).forEach(h=>{
        const it=el('div',{cls:'search-item',onClick:()=>{inp.value=h;S.searchQuery=h;S.searchActive=true;inp.dispatchEvent(new Event('input'));}});
        it.appendChild(el('span',{css:'color:var(--txt3);font-size:12px;'},[txt('')]));
        it.appendChild(el('span',{},[h]));
        dropdown.appendChild(it);
      });
    }
    // Авторекомендации — ТОЛЬКО названия товаров
    if(results.length){
      if(!query&&S.searchHistory.length)dropdown.appendChild(el('div',{css:'height:.5px;background:rgba(255,255,255,.08);margin:4px 0;'}));
      results.slice(0,6).forEach(p=>{
        const pName=getItemName(p);
        const it=el('div',{cls:'search-item',onClick:()=>{inp.value=pName;S.searchQuery=pName;S.searchActive=true;addToHistory(pName);hideDropdown();refreshGrid();clearBtn.style.display='block';}});
        it.appendChild(el('span',{css:'font-size:18px;width:24px;text-align:center;flex-shrink:0;'},[p.e]));
        it.appendChild(el('div',{css:'font-size:13px;font-weight:600;'},[pName]));
        dropdown.appendChild(it);
      });
    } else if(query){
      dropdown.appendChild(el('div',{css:'padding:16px;text-align:center;color:var(--txt3);font-size:13px;'},['Ничего не найдено']));
    }
    wrap.appendChild(dropdown);
  }

  function addToHistory(q){if(!q)return;S.searchHistory=S.searchHistory.filter(h=>h!==q);S.searchHistory.unshift(q);S.searchHistory=S.searchHistory.slice(0,6);save();}

  inp.addEventListener('focus',()=>{
    const q=inp.value.toLowerCase().trim();
    const all=[...FLOWERS,...GIFTS];
    const matches=q?all.filter(p=>getItemName(p).toLowerCase().includes(q)):all.slice(0,6);
    showDropdown(matches,q);
  });
  inp.addEventListener('input',()=>{
    const q=inp.value.toLowerCase().trim();
    S.searchQuery=inp.value;clearBtn.style.display=inp.value?'block':'none';
    const all=[...FLOWERS,...GIFTS];
    const matches=q?all.filter(p=>getItemName(p).toLowerCase().includes(q)):[];
    showDropdown(matches,q);
    S.searchActive=!!q;refreshGrid();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const q=inp.value.trim();if(q)addToHistory(q);hideDropdown();inp.blur();refreshGrid();}
    if(e.key==='Escape'){S.searchQuery='';S.searchActive=false;inp.value='';clearBtn.style.display='none';hideDropdown();refreshGrid();}
  });
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))hideDropdown();});
  row.appendChild(inp);row.appendChild(clearBtn);
  wrap.appendChild(row);
  return wrap;
}

// ── Общая отрисовка сетки товаров (каталог + поиск + фильтры + empty-state) ──
// Используется и при первичной отрисовке вкладки, и при вводе в поиск —
// поэтому подсказка "не найдено, но есть в другом разделе" не пропадает
// при переключении между разделами.
function populateGrid(sec){
  const gridId=sec==='f'?'flowers-grid':'gifts-grid';
  const gridEl=document.getElementById(gridId);
  if(!gridEl)return;
  const q=(S.searchQuery||'').toLowerCase().trim();
  let items=sec==='f'?[...FLOWERS]:[...GIFTS];
  if(sec==='f'){
    const f=S.ff;
    if(f.types.length)items=items.filter(i=>f.types.includes(i.type));
    if(f.minP>0||f.maxP<8000)items=items.filter(i=>i.price>=f.minP&&i.price<=f.maxP);
    if(f.minH>50||f.maxH<100)items=items.filter(i=>i.h>=f.minH&&i.h<=f.maxH);
  }else{
    const f=S.gf;
    if(f.type)items=items.filter(i=>i.type===f.type);
    if(f.vegan)items=items.filter(i=>i.vegan);
    if(f.halal)items=items.filter(i=>i.halal);
    if(f.noNuts)items=items.filter(i=>i.noNuts);
    if(f.minP>0||f.maxP<5000)items=items.filter(i=>i.price>=f.minP&&i.price<=f.maxP);
  }
  if(q)items=items.filter(p=>{
    const name=getItemName(p);
    return name.toLowerCase().includes(q)||(p.shopName||'').toLowerCase().includes(q)||(p.type||'').toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q));
  });
  items=sortItems(items);
  gridEl.innerHTML='';
  if(items.length){items.forEach(p=>gridEl.appendChild(buildCard(p,sec)));return;}
  if(!q)return;
  const otherSec=sec==='f'?'g':'f';
  const otherItems=(otherSec==='f'?[...FLOWERS]:[...GIFTS]).filter(p=>getItemName(p).toLowerCase().includes(q));
  if(otherItems.length){
    const otherName=otherSec==='g'?'Подарки':'Цветы';
    const msg=el('div',{css:'grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:45vh;padding:40px 20px;text-align:center;'});
    msg.appendChild(el('div',{css:'font-size:64px;margin-bottom:16px;'},['\uD83D\uDD0E']));
    msg.appendChild(el('div',{css:'font-size:20px;font-weight:800;margin-bottom:10px;'},['В этом разделе не найдено']));
    msg.appendChild(el('div',{css:'font-size:16px;font-weight:700;color:var(--accent);margin-bottom:24px;line-height:1.6;'},
      ['Но «'+q+'» есть в разделе «'+otherName+'»']));

    const shown=otherItems.slice(0,3);
    const cardsRow=el('div',{css:'display:flex;justify-content:center;gap:10px;width:100%;max-width:420px;margin-bottom:24px;flex-wrap:nowrap;'});
    shown.forEach(p=>{
      const mc=el('div',{css:'width:104px;cursor:pointer;text-align:left;flex-shrink:0;',
        onClick:()=>{S.tab=otherSec==='f'?0:1;S.detail={p,sec:otherSec};render();}});
      const mcImg=el('div',{css:'width:104px;height:104px;border-radius:16px;background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:6px;box-shadow:var(--card-shadow);'});
      if(p.imgUrl){const im=document.createElement('img');im.src=p.imgUrl;im.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';mcImg.appendChild(im);}
      else mcImg.appendChild(el('span',{},[p.e||'\uD83C\uDF38']));
      mc.appendChild(mcImg);
      mc.appendChild(el('div',{css:'font-size:11.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;'},[getItemName(p)]));
      cardsRow.appendChild(mc);
    });
    if(otherItems.length>3){
      const moreBtn=el('div',{css:'width:104px;height:104px;border-radius:16px;background:rgba(238,158,35,.12);border:1.5px dashed rgba(238,158,35,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex-shrink:0;',
        onClick:()=>{S.tab=otherSec==='f'?0:1;render();}});
      moreBtn.appendChild(el('div',{css:'font-size:26px;color:var(--accent);'},['\u2192']));
      moreBtn.appendChild(el('div',{css:'font-size:11px;font-weight:700;color:var(--accent);'},['Ещё']));
      cardsRow.appendChild(moreBtn);
    }
    msg.appendChild(cardsRow);

    const goB=el('button',{cls:'btn-prim',css:'padding:14px 32px;font-size:16px;',onClick:()=>{S.tab=otherSec==='f'?0:1;render();}});
    goB.textContent='Перейти в '+otherName;
    msg.appendChild(goB);
    gridEl.appendChild(msg);
  } else {
    const msg=el('div',{css:'grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:45vh;padding:40px 24px;text-align:center;'});
    msg.appendChild(el('div',{css:'font-size:72px;margin-bottom:16px;'},['\uD83D\uDE14']));
    msg.appendChild(el('div',{css:'font-size:20px;font-weight:800;margin-bottom:8px;'},['Ничего не найдено']));
    msg.appendChild(el('div',{css:'font-size:14px;color:var(--txt3);'},['Попробуйте другой запрос']));
    gridEl.appendChild(msg);
  }
}

function sortItems(items){
  if(S.sortBy==='cheap')return items.sort((a,b)=>a.price-b.price);
  if(S.sortBy==='exp')return items.sort((a,b)=>b.price-a.price);
  return items.sort((a,b)=>b.sold-a.sold);
}
function buildFSBar(){
  const row=el('div',{cls:'fbar'});
  const hasF=hasFilters();
  const sp=el('div',{cls:'fpill'+(S.sortBy!=='popular'?' on':''),onClick:()=>{S.sortOpen=!S.sortOpen;S.filterOpen=false;render();}});
  sp.textContent='↕ Сортировка';
  const fp=el('div',{cls:'fpill'+(hasF?' on':''),onClick:()=>{S.filterOpen=!S.filterOpen;S.sortOpen=false;render();}});
  fp.textContent='Фильтры'+(hasF?' ●':'');
  row.appendChild(sp);row.appendChild(fp);
  return row;
}
function hasFilters(){
  if(S.tab===0){const f=S.ff;return !!(f.types.length||f.minP>0||f.maxP<8000||f.minH>50||f.maxH<100);}
  const f=S.gf;return !!(f.type||f.vegan||f.halal||f.noNuts||f.minP>0||f.maxP<5000);
}

function buildCard(p,sec){
  const card=el('div',{cls:'card',onClick:()=>{S.detail={p,sec};render();}});
  const qty=S.cart[p.id]||0;

  // ── Изображение ──
  const img=el('div',{cls:'card-img'});
  if(p.imgUrl){const im=document.createElement('img');im.src=p.imgUrl;im.alt='';img.appendChild(im);}
  else img.appendChild(el('span',{css:'position:relative;z-index:1;'},[p.e]));

  // Цветные теги поверх фото
  if((p.tags||[]).length){
    const tags=el('div',{cls:'card-tags'});
    (p.tags||[]).slice(0,2).forEach(t=>tags.appendChild(el('div',{cls:'tag '+tagClass(t)},[t])));
    img.appendChild(tags);
  }
  card.appendChild(img);

  // ── Тело карточки ──
  const body=el('div',{cls:'card-body'});

  // Название (2 строки макс)
  body.appendChild(el('div',{cls:'card-name'},[sec==='f'?flName(p):p.name]));

  // Название магазина — видно снаружи, до провала в карточку
  if(p.shopName){
    body.appendChild(el('div',{cls:'card-shop'},[p.shopName]));
  }

  // Рейтинг — 5 звёзд снаружи карточки
  if(p.rating!=null){
    const starsRow=el('div',{cls:'card-stars'});
    const full=Math.floor(p.rating);
    const half=p.rating-full>=0.5;
    for(let i=0;i<5;i++){
      const s=document.createElement('span');
      s.textContent=i<full?'★':(i===full&&half?'⯨':'☆');
      s.style.color=i<full||(i===full&&half)?'#ffd60a':'rgba(255,255,255,.2)';
      starsRow.appendChild(s);
    }
    starsRow.appendChild(el('span',{css:'color:var(--txt3);font-size:10px;margin-left:2px;'},[String(p.rating)]));
    body.appendChild(starsRow);
  }

  // Цена + кнопка
  const foot=el('div',{cls:'card-foot'});
  foot.appendChild(el('div',{cls:'card-price'},[p.price.toLocaleString('ru')+' ₽']));

  if(qty===0){
    const ab=el('button',{cls:'add-btn',onClick:(e)=>{
      e.stopPropagation();
      if(!S.user){showNotif('Войдите в аккаунт','⚠️');return;}
      addCart(p.id);
      const c=ab.closest('.card');
      if(c){c.replaceWith(buildCard(p,sec));}
    }});
    ab.textContent='+';foot.appendChild(ab);
  }else{
    const qp=el('div',{cls:'qty-pill'});
    qp.appendChild(el('button',{cls:'qty-btn',onClick:(e)=>{
      e.stopPropagation();remCart(p.id);
      const c=qp.closest('.card');if(c){c.replaceWith(buildCard(p,sec));}
    }},[txt('−')]));
    qp.appendChild(el('span',{cls:'qty-n'},[txt(qty)]));
    qp.appendChild(el('button',{cls:'qty-btn',onClick:(e)=>{
      e.stopPropagation();addCart(p.id);
      const c=qp.closest('.card');if(c){c.replaceWith(buildCard(p,sec));}
    }},[txt('+')]));
    foot.appendChild(qp);
  }

  body.appendChild(foot);
  card.appendChild(body);
  return card;
}

    qp.appendChild(el('span',{css:'font-size:18px;font-weight:800;color:#fff;'},[txt(qty)]));
    qp.appendChild(el('button',{css:'background:none;border:none;color:#fff;font-size:22px;cursor:pointer;font-weight:800;',onClick:()=>{addCart(p.id);render();}},[txt('+')]));

  return page;

function buildSort(){
  const ov=el('div',{cls:'overlay fade-in',onClick:(e)=>{if(e.target===ov){S.sortOpen=false;render();}}});
  const sh=el('div',{cls:'sheet slide-up'});
  sh.appendChild(el('div',{cls:'drag'}));

function buildRangeSec(title,min,max,vMin,vMax,onChange){
  const sec=el('div',{css:'padding:0 16px 16px;'});
  const lbl=el('div',{cls:'inp-label',css:'display:block;'});
  lbl.id='rlbl_'+title.replace(/[^a-zа-я]/gi,'');
  lbl.textContent=title+': '+vMin.toLocaleString('ru')+' – '+vMax.toLocaleString('ru');
  sec.appendChild(lbl);
  const wrap=el('div',{css:'position:relative;margin-top:18px;padding:0 2px;'});
  const track=el('div',{cls:'range-wrap'});
  const fill=el('div',{cls:'range-fill'});
  const pMin=((vMin-min)/(max-min))*100;
  const pMax=((vMax-min)/(max-min))*100;
  fill.style.left=pMin+'%';fill.style.right=(100-pMax)+'%';
  track.appendChild(fill);
  const r1=el('input',{type:'range',min,max,value:vMin});
  const r2=el('input',{type:'range',min,max,value:vMax});
  // ИСПРАВЛЕН: оба ползунка работают
  r1.style.zIndex=+r1.value>=+r2.value-10?'5':'4';
  r2.style.zIndex='4';
  r1.oninput=()=>{
    if(+r1.value>+r2.value)r1.value=r2.value;
    const p1=((+r1.value-min)/(max-min))*100;
    const p2=((+r2.value-min)/(max-min))*100;
    fill.style.left=p1+'%';fill.style.right=(100-p2)+'%';
    lbl.textContent=title+': '+(+r1.value).toLocaleString('ru')+' – '+(+r2.value).toLocaleString('ru');
    onChange(+r1.value,+r2.value);
  };
  r2.oninput=()=>{
    if(+r2.value<+r1.value)r2.value=r1.value;
    const p1=((+r1.value-min)/(max-min))*100;
    const p2=((+r2.value-min)/(max-min))*100;
    fill.style.left=p1+'%';fill.style.right=(100-p2)+'%';
    lbl.textContent=title+': '+(+r1.value).toLocaleString('ru')+' – '+(+r2.value).toLocaleString('ru');
    onChange(+r1.value,+r2.value);
  };
  track.appendChild(r1);track.appendChild(r2);
  wrap.appendChild(track);sec.appendChild(wrap);
  return sec;
}

function buildCheckout(){

// Шаг 0 — выбор времени доставки (карусель)
function buildCO0(page){
  const co=S.checkout;
  page.appendChild(coHdr('Доставка',()=>{co._tempAddr=null;S.checkout=null;S.cartOpen=true;render();}));

  const scr=el('div',{cls:'scroll',css:'padding:0 0 100px;'});

  // ── Функция получения слотов для конкретной даты ──
  function getSlotsForDate(dateMs){
    const mskOffset=3*60*60*1000;
    const nowMsk=new Date(Date.now()+mskOffset);
    const dateMsk=new Date(dateMs+mskOffset);
    const isToday=nowMsk.toISOString().slice(0,10)===dateMsk.toISOString().slice(0,10);
    const minHour=isToday?(nowMsk.getUTCHours()+(nowMsk.getUTCMinutes()>0?1:0)+2):9;
    const slots=[];
    if(isToday)slots.push({id:'asap_'+dateMs,label:'Как можно быстрее',sub:'~2 ч',date:dateMs});
    for(let h=9;h<=20;h++){
      if(h<minHour)continue;
      slots.push({id:h+':00_'+dateMs,label:h+':00 – '+(h+1)+':00',sub:'',date:dateMs,hour:h});
    }
    return slots;
  }

  // ── Генерируем дни (сегодня + 6 дней вперёд) ──────
  const mskNow=Date.now()+3*60*60*1000;
  const todayMsk=new Date(mskNow);
  todayMsk.setUTCHours(0,0,0,0);

  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(todayMsk.getTime()+i*86400000);
    days.push({ms:d.getTime(), date:d});
  }

  // ── Состояние ──────────────────────────────────────
  let selectedDayIdx=0;
  let calendarOpen=false;

  const RU_DAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const RU_MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  function dayLabel(d,idx){
    const weekday=RU_DAYS[d.getUTCDay()];
    const dm=d.getUTCDate()+' '+RU_MONTHS[d.getUTCMonth()];
    if(idx===0)return 'Сегодня, '+weekday+', '+dm;
    if(idx===1)return 'Завтра, '+weekday+', '+dm;
    return weekday+', '+dm;
  }

  // ── Контейнер заголовка дня ────────────────────────
  const dateLabel=document.createElement('div');
  dateLabel.style.cssText='font-size:17px;font-weight:800;text-align:center;padding:18px 16px 4px;';

  // ── Карусель слотов ────────────────────────────────
  const carousel=document.createElement('div');
  carousel.style.cssText='overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 8px;scroll-snap-type:x mandatory;display:flex;gap:10px;scrollbar-width:none;';
  carousel.style['-ms-overflow-style']='none';

  const continueBtn=document.createElement('button');
  continueBtn.className='btn-prim';
  continueBtn.id='co0-continue';
  continueBtn.textContent='Продолжить →';
  continueBtn.disabled=true;
  continueBtn.style.opacity='0.4';

  function renderSlots(){
    const d=days[selectedDayIdx];
    dateLabel.textContent=dayLabel(d.date,selectedDayIdx);
    carousel.innerHTML='';
    const slots=getSlotsForDate(d.ms);

    if(slots.length===0){
      const empty=document.createElement('div');
      empty.style.cssText='padding:20px 16px;color:var(--txt3);font-size:14px;';
      empty.textContent='На этот день нет доступных слотов';
      carousel.appendChild(empty);
      return;
    }

    slots.forEach(slot=>{
      const sel=co.timeSlot===slot.id;
      const btn=document.createElement('div');
      btn.style.cssText='flex-shrink:0;scroll-snap-align:start;padding:14px 18px;border-radius:16px;border:1.5px solid '+(sel?'var(--accent)':'var(--border2)')+';background:'+(sel?'rgba(238,158,35,.12)':'var(--bg2)')+';cursor:pointer;transition:all .2s;text-align:center;min-width:130px;';
      btn.dataset.slotId=slot.id;

      const lbl=document.createElement('div');
      lbl.style.cssText='font-size:14px;font-weight:700;color:'+(sel?'var(--accent)':'var(--txt)')+';';
      lbl.textContent=slot.label;
      btn.appendChild(lbl);

      if(slot.sub){
        const sub=document.createElement('div');
        sub.style.cssText='font-size:11px;color:var(--txt3);margin-top:3px;';
        sub.textContent=slot.sub;
        btn.appendChild(sub);
      }

      btn.addEventListener('click',()=>{
        co.timeSlot=slot.id;
        co.timeSlotLabel=slot.label;
        co.timeSlotDate=d.date.toLocaleDateString('ru',{day:'numeric',month:'long'});
        // Обновляем стили без ре-рендера
        carousel.querySelectorAll('[data-slot-id]').forEach(b=>{
          const active=b.dataset.slotId===slot.id;
          b.style.borderColor=active?'var(--accent)':'var(--border2)';
          b.style.background=active?'rgba(238,158,35,.12)':'var(--bg2)';
          b.querySelector('div').style.color=active?'var(--accent)':'var(--txt)';
        });
        continueBtn.disabled=false;
        continueBtn.style.opacity='1';
      });

      carousel.appendChild(btn);
    });
  }

  // ── Навигация по дням (стрелки) ───────────────────
  const navRow=document.createElement('div');
  navRow.style.cssText='display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px 6px;';

  const prevBtn=document.createElement('button');
  prevBtn.style.cssText='background:var(--input-bg);border:1px solid var(--input-border);border-radius:50%;width:36px;height:36px;color:var(--txt2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
  prevBtn.textContent='‹';
  prevBtn.addEventListener('click',()=>{if(selectedDayIdx>0){selectedDayIdx--;renderSlots();}});

  const nextBtn=prevBtn.cloneNode(false);
  nextBtn.textContent='›';
  nextBtn.addEventListener('click',()=>{if(selectedDayIdx<days.length-1){selectedDayIdx++;renderSlots();}});

  navRow.appendChild(prevBtn);
  navRow.appendChild(dateLabel);
  navRow.appendChild(nextBtn);

  // ── Кнопка выбора даты ────────────────────────────
  const chooseDateBtn=document.createElement('button');
  chooseDateBtn.style.cssText='display:block;margin:4px auto 0;background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;';
  chooseDateBtn.textContent='Выбрать дату';

  // ── Календарь ─────────────────────────────────────
  const calOverlay=document.createElement('div');
  calOverlay.style.cssText='position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;';

  const calSheet=document.createElement('div');

  calSheet.innerHTML='<div style="width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 16px;"></div><div style="font-size:17px;font-weight:800;text-align:center;margin-bottom:14px;">Выберите дату</div>';

  const calGrid=document.createElement('div');
  calGrid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;';

  let calSelectedIdx=selectedDayIdx;
  const calBtns=[];

  days.forEach((d,di)=>{
